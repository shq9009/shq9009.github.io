<script>
var DATA=[{"id": 1, "v": 1, "src": "《实践论》(1937年7月)", "q": "实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。", "dr": "挑一件你拖了很久「还没想好」的小事，今天就迈出第一步，哪怕只做十分钟。做完记一笔：跟空想时比，多看清楚了什么。", "ck": ["我没有再等「想清楚」，先动手了", "我在做的过程中记下一个新发现", "我知道下一步该试什么"], "pt": "《沁园春·长沙》", "pq": "曾记否，到中流击水，浪遏飞舟？", "plk": "中流击水才知道浪有多急——很多事下了水，才学得会游。", "hook": "读了毛选我才知道，人生很多事，是想不明白的，做着做着就明白了", "pain": "很多人一辈子在等“想清楚了再开始”，等来等去，开始的那天一直没来。方向大致对就走，路上的答案，比床上的答案准。", "pyq": "读了毛选我才知道，人生很多事，是想不明白的，做着做着就明白了\n\n「曾记否，到中流击水，浪遏飞舟？」——毛泽东《沁园春·长沙》\n\n很多人一辈子在等“想清楚了再开始”，等来等去，开始的那天一直没来。方向大致对就走，路上的答案，比床上的答案准。\n\n毛选原文「实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。」\n—— 毛泽东《实践论》\n\n日拱一卒 · 功不唐捐"}, {"id": 2, "v": 1, "src": "《实践论》(1937年7月)", "q": "理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。", "dr": "挑一个你最近下的结论（比如「他就是那种人」），今天再验证一次：记下一个佐证，或一个反例。", "ck": ["我给一个老结论找了新证据", "我承认了一个和我想法相反的事实", "我没有急着给人贴标签"], "pt": "《七律·长征》", "pq": "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "plk": "走过万水千山，回头才看出五岭只是细浪——材料攒够了，规律自己浮现。", "hook": "读了毛选我才知道，看不清一件事，往往是因为你见得太少", "pain": "对人对事下判断太快，是因为样本太少。多见几个人，多经几件事，很多困惑会自己散掉。", "pyq": "读了毛选我才知道，看不清一件事，往往是因为你见得太少\n\n「五岭逶迤腾细浪，乌蒙磅礴走泥丸。」——毛泽东《七律·长征》\n\n对人对事下判断太快，是因为样本太少。多见几个人，多经几件事，很多困惑会自己散掉。\n\n毛选原文「理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。」\n—— 毛泽东《实践论》\n\n日拱一卒 · 功不唐捐"}, {"id": 3, "v": 1, "src": "《实践论》(1937年7月)", "q": "判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。", "dr": "给一段关系或一个决定定一个「检验点」：一个月后看什么结果，今天把它写进备忘录。", "ck": ["我用「结果」而不是「感觉」检验了一件事", "我给一个判断定下了检验时间", "我没有把好听话当成真答案"], "pt": "《七律·长征》", "pq": "更喜岷山千里雪，三军过后尽开颜。", "plk": "过了岷山才开颜——事情见了结果，才算真正走完。", "hook": "读了毛选我才知道，嘴上说好的关系，都经不起一件事的检验", "pain": "顺境里的朋友个个真心，落难时才知道谁真的在。时间，是这世上最诚实的验钞机。", "pyq": "读了毛选我才知道，嘴上说好的关系，都经不起一件事的检验\n\n「更喜岷山千里雪，三军过后尽开颜。」——毛泽东《七律·长征》\n\n顺境里的朋友个个真心，落难时才知道谁真的在。时间，是这世上最诚实的验钞机。\n\n毛选原文「判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。」\n—— 毛泽东《实践论》\n\n日拱一卒 · 功不唐捐"}, {"id": 4, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "在复杂的事物的发展过程中，有许多的矛盾存在，其中必有一种是主要的矛盾，由于它的存在和发展规定或影响着其他矛盾的存在和发展。", "dr": "把最近烦你的事全列在纸上，圈出那个牵动其他所有的，今晚只为它做一件事。", "ck": ["我把烦恼写下来并排了序", "我找到了那个牵一发动全身的问题", "我为它做了至少一件实事"], "pt": "《清平乐·六盘山》", "pq": "今日长缨在手，何时缚住苍龙？", "plk": "长缨在手，缚的是苍龙：一单再乱，也要先认准那条龙。", "hook": "读了毛选我才知道，日子过乱的人，不是事太多，是没分清哪件最要紧", "pain": "工作、家人、身体、感情，一堆问题压着的时候，先解决那个牵动其他所有的。抓住它，剩下的会松一大半。", "pyq": "读了毛选我才知道，日子过乱的人，不是事太多，是没分清哪件最要紧\n\n「今日长缨在手，何时缚住苍龙？」——毛泽东《清平乐·六盘山》\n\n工作、家人、身体、感情，一堆问题压着的时候，先解决那个牵动其他所有的。抓住它，剩下的会松一大半。\n\n毛选原文「在复杂的事物的发展过程中，有许多的矛盾存在，其中必有一种是主要的矛盾，由于它的存在和发展规定或影响着其他矛盾的存在和发展。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 5, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "如果不研究矛盾的特殊性，就无从确定一事物不同于他事物的特殊的本质，就无从辨别事物，无从区分科学研究的领域。", "dr": "想一个你最近看不惯的人，写下一句「他可能也有他的难处」，今天对他少一句评判、多一分客气。", "ck": ["我对一个人收回了先入为主的评判", "我试着站在他的处境想了一回", "我说出口的话比心里的话客气"], "pt": "《菩萨蛮·大柏地》", "pq": "赤橙黄绿青蓝紫，谁持彩练当空舞？", "plk": "赤橙黄绿青蓝紫，七色才成虹——人和人不一样，正是要用心的地方。", "hook": "读了毛选我才知道，每个人的难处都不一样，别拿自己的尺子量别人", "pain": "你看不惯的人，可能有你看不见的难；你觉得容易的事，可能是别人熬了多年的结果。多一分理解，少一分苛责。", "pyq": "读了毛选我才知道，每个人的难处都不一样，别拿自己的尺子量别人\n\n「赤橙黄绿青蓝紫，谁持彩练当空舞？」——毛泽东《菩萨蛮·大柏地》\n\n你看不惯的人，可能有你看不见的难；你觉得容易的事，可能是别人熬了多年的结果。多一分理解，少一分苛责。\n\n毛选原文「如果不研究矛盾的特殊性，就无从确定一事物不同于他事物的特殊的本质，就无从辨别事物，无从区分科学研究的领域。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 6, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "唯物辩证法认为外因是变化的条件，内因是变化的根据，外因通过内因而起作用。", "dr": "挑一件你一直在等别人帮的事，今天自己做掉第一步，做完记一笔「原来我可以」。", "ck": ["我把一件指望别人的事接了回来", "我为自己做成了第一步", "我没有把「没人帮我」挂在嘴上"], "pt": "《西江月·井冈山》", "pq": "敌军围困万千重，我自岿然不动。", "plk": "围困万千重而岿然不动——根基在里不在外：自己不动，别人怎么推都白搭。", "hook": "读了毛选我才知道，别人推你一把，只能扶你一阵；能站起来的，从来是你自己", "pain": "靠山会倒，靠人会跑。把指望收回来放在自己身上，日子才真正开始变好。", "pyq": "读了毛选我才知道，别人推你一把，只能扶你一阵；能站起来的，从来是你自己\n\n「敌军围困万千重，我自岿然不动。」——毛泽东《西江月·井冈山》\n\n靠山会倒，靠人会跑。把指望收回来放在自己身上，日子才真正开始变好。\n\n毛选原文「唯物辩证法认为外因是变化的条件，内因是变化的根据，外因通过内因而起作用。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 7, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "一切矛盾着的东西，互相联系着，不但在一定条件之下共处于一个统一体中，而且在一定条件之下互相转化，这就是矛盾的同一性的全部意义。", "dr": "想一个和你有过节或较劲的人，今天主动释放一点善意（一句问候也算），把路留宽一格。", "ck": ["我主动给一段紧的关系松了绑", "我从「对手」身上看到值得学的一点", "我没把话说死、把事做绝"], "pt": "《念奴娇·昆仑》", "pq": "太平世界，环球同此凉热。", "plk": "把昆仑裁为三截，为的是环球同此凉热——市场不必你死我活，能共存才是大格局。", "hook": "读了毛选我才知道，对手不一定是敌人，坏事不一定是坏事", "pain": "让你难受的人和事，换个角度看都在教你什么。冤家宜解不宜结，路留宽一点，来日好相见。", "pyq": "读了毛选我才知道，对手不一定是敌人，坏事不一定是坏事\n\n「太平世界，环球同此凉热。」——毛泽东《念奴娇·昆仑》\n\n让你难受的人和事，换个角度看都在教你什么。冤家宜解不宜结，路留宽一点，来日好相见。\n\n毛选原文「一切矛盾着的东西，互相联系着，不但在一定条件之下共处于一个统一体中，而且在一定条件之下互相转化，这就是矛盾的同一性的全部意义。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 8, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "对抗是矛盾斗争的一种形式，而不是矛盾斗争的一切形式。", "dr": "想一件你该说「不」却一直没说的事，今天客气而坚定地说出来；再挑一件可以退让的小事，痛快让掉。", "ck": ["我在原则的事上说了「不」", "我在小事上痛快退了一步", "硬和软，我今天都用对了地方"], "pt": "《七律·冬云》", "pq": "独有英雄驱虎豹，更无豪杰怕熊罴。", "plk": "驱虎豹不怕熊罴是刚，放眼量不计牢骚是柔——刚柔都用对场合，才叫策略。", "hook": "读了毛选我才知道，该硬时硬不起来，是一生的软肋；该软时软不下来，是一生的硬伤", "pain": "一味的硬伤人，一味的软伤己。原则上的事不让步，面子上的事多让步，日子就顺了。", "pyq": "读了毛选我才知道，该硬时硬不起来，是一生的软肋；该软时软不下来，是一生的硬伤\n\n「独有英雄驱虎豹，更无豪杰怕熊罴。」——毛泽东《七律·冬云》\n\n一味的硬伤人，一味的软伤己。原则上的事不让步，面子上的事多让步，日子就顺了。\n\n毛选原文「对抗是矛盾斗争的一种形式，而不是矛盾斗争的一切形式。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 9, "v": 1, "src": "《反对本本主义》(1930年5月)", "q": "没有调查，没有发言权。", "dr": "对一件你本想评价的事，先问一个当事人「后来怎么样了」，听完再决定要不要开口。", "ck": ["我先问后说，没有抢着下结论", "我听完了别人的完整经过", "我把「我以为」换成了「他说的」"], "pt": "《如梦令·元旦》", "pq": "宁化、清流、归化，路隘林深苔滑。", "plk": "路隘林深苔滑——不亲自走一趟，你永远不知道路有多滑。", "hook": "读了毛选我才知道，不了解就下结论，是人与人之间最大的冒犯", "pain": "没经历过别人的日子，就别轻易评价别人的选择。多问一句，少判一句，关系就好处了。", "pyq": "读了毛选我才知道，不了解就下结论，是人与人之间最大的冒犯\n\n「宁化、清流、归化，路隘林深苔滑。」——毛泽东《如梦令·元旦》\n\n没经历过别人的日子，就别轻易评价别人的选择。多问一句，少判一句，关系就好处了。\n\n毛选原文「没有调查，没有发言权。」\n—— 毛泽东《反对本本主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 10, "v": 1, "src": "《反对本本主义》(1930年5月)", "q": "调查就像“十月怀胎”，解决问题就像“一朝分娩”。调查就是解决问题。", "dr": "把一件想不通的事带出门：散步、办事、见人，路上留意相关的迹象，回来写下三条所见。", "ck": ["我没有闷在屋里空想", "我带回了三个真实的观察", "那件事看起来清楚了一点"], "pt": "《西江月·秋收起义》", "pq": "秋收时节暮云愁，霹雳一声暴动。", "plk": "秋收时节暮云沉，一声霹雳天下白——调查做透了，答案自己会炸出来。", "hook": "读了毛选我才知道，很多想不通的事，只是因为你还没去看", "pain": "闷在屋里想，越想越乱；走出去看看，很多问题见着见着就解了。答案多半在路上。", "pyq": "读了毛选我才知道，很多想不通的事，只是因为你还没去看\n\n「秋收时节暮云愁，霹雳一声暴动。」——毛泽东《西江月·秋收起义》\n\n闷在屋里想，越想越乱；走出去看看，很多问题见着见着就解了。答案多半在路上。\n\n毛选原文「调查就像“十月怀胎”，解决问题就像“一朝分娩”。调查就是解决问题。」\n—— 毛泽东《反对本本主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 11, "v": 1, "src": "《反对本本主义》(1930年5月)", "q": "中国革命斗争的胜利要靠中国同志了解中国情况。", "dr": "面前若有大决定，今天收集各方意见列一张单子，最后一栏留给自己写「我想要什么」。", "ck": ["我听足了各方的意见", "我写下了自己真正想要的", "我准备为自己的选择负责"], "pt": "《菩萨蛮·黄鹤楼》", "pq": "烟雨莽苍苍，龟蛇锁大江。", "plk": "烟雨莽苍苍，龟蛇锁大江——江面什么模样，得你自己站上去看。", "hook": "读了毛选我才知道，自己的人生，别人给不了地图", "pain": "父母的建议、朋友的意见都值得听，但路要自己走过才算数。别人的地图，画不出你的路。", "pyq": "读了毛选我才知道，自己的人生，别人给不了地图\n\n「烟雨莽苍苍，龟蛇锁大江。」——毛泽东《菩萨蛮·黄鹤楼》\n\n父母的建议、朋友的意见都值得听，但路要自己走过才算数。别人的地图，画不出你的路。\n\n毛选原文「中国革命斗争的胜利要靠中国同志了解中国情况。」\n—— 毛泽东《反对本本主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 12, "v": 1, "src": "《人的正确思想是从哪里来的？》(1963年5月)", "q": "一个正确的认识，往往需要经过由物质到精神，由精神到物质，即由实践到认识，由认识到实践这样多次的反复，才能够完成。", "dr": "拾起一件你放弃了的正事，今天只做「第二次尝试」的第一小步。", "ck": ["我允许了事情再试一次", "我比上次多看清了一点", "我没有因为一次不成就否定全部"], "pt": "《十六字令三首》", "pq": "山，快马加鞭未下鞍。惊回首，离天三尺三。", "plk": "过了这山还有那山——大单的反复不是失败，是路程本身。", "hook": "读了毛选我才知道，一次没成的事，不代表不行，只是还没到时候", "pain": "求而不得是人生常态。第一次不成，第二次看清一点，第三次接近一点。肯再来的人，运气都不会太差。", "pyq": "读了毛选我才知道，一次没成的事，不代表不行，只是还没到时候\n\n「山，快马加鞭未下鞍。惊回首，离天三尺三。」——毛泽东《十六字令三首》\n\n求而不得是人生常态。第一次不成，第二次看清一点，第三次接近一点。肯再来的人，运气都不会太差。\n\n毛选原文「一个正确的认识，往往需要经过由物质到精神，由精神到物质，即由实践到认识，由认识到实践这样多次的反复，才能够完成。」\n—— 毛泽东《人的正确思想是从哪里来的？》\n\n日拱一卒 · 功不唐捐"}, {"id": 13, "v": 1, "src": "《改造我们的学习》(1941年5月)", "q": "“实事”就是客观存在着的一切事物，“是”就是客观事物的内部联系，即规律性，“求”就是我们去研究。", "dr": "拿张纸诚实写下你现状的三条（钱、时间、身体都行），不美化不遮掩，然后挑一条写一个改进动作。", "ck": ["我如实写下了自己的现状", "我没有美化也没有抱怨", "我选了一条开始改"], "pt": "《七律·登庐山》", "pq": "冷眼向洋看世界，热风吹雨洒江天。", "plk": "冷眼看世界，热风吹江天——实事求是就是：心要热，眼睛要冷。", "hook": "读了毛选我才知道，人最难得的，是承认自己现在过得不好", "pain": "装出来的体面骗得了朋友圈，骗不了日子。承认现状，是改变现状的第一步。", "pyq": "读了毛选我才知道，人最难得的，是承认自己现在过得不好\n\n「冷眼向洋看世界，热风吹雨洒江天。」——毛泽东《七律·登庐山》\n\n装出来的体面骗得了朋友圈，骗不了日子。承认现状，是改变现状的第一步。\n\n毛选原文「“实事”就是客观存在着的一切事物，“是”就是客观事物的内部联系，即规律性，“求”就是我们去研究。」\n—— 毛泽东《改造我们的学习》\n\n日拱一卒 · 功不唐捐"}, {"id": 14, "v": 1, "src": "《改造我们的学习》(1941年5月)", "q": "马克思列宁主义之箭，必须用了去射中国革命之的。", "dr": "今天开口前先想三秒「对面是谁、他在乎什么」，挑一件重要的事，按对方的方式把话说一遍。", "ck": ["我开口前看了「靶子」", "我按对方在乎的方式说话", "有一句原本会呛的话，今天说顺了"], "pt": "《七律·长征》", "pq": "金沙水拍云崖暖，大渡桥横铁索寒。", "plk": "金沙用暖，大渡用寒——两条河两座桥，方法对着问题来才叫有的放矢。", "hook": "读了毛选我才知道，说话有人听的人，都先想清楚了对面是谁", "pain": "对父母、爱人、孩子，说的其实是不同的语言。开口之前先看人，很多争吵根本不会发生。", "pyq": "读了毛选我才知道，说话有人听的人，都先想清楚了对面是谁\n\n「金沙水拍云崖暖，大渡桥横铁索寒。」——毛泽东《七律·长征》\n\n对父母、爱人、孩子，说的其实是不同的语言。开口之前先看人，很多争吵根本不会发生。\n\n毛选原文「马克思列宁主义之箭，必须用了去射中国革命之的。」\n—— 毛泽东《改造我们的学习》\n\n日拱一卒 · 功不唐捐"}, {"id": 15, "v": 1, "src": "《反对党八股》(1942年2月)", "q": "射箭要看靶子，弹琴要看听众，写文章做演说倒可以不看读者不看听众吗？", "dr": "给家里每个人挑一种他喜欢的说话方式：对谁多夸一句、对谁少讲道理、对谁只陪着，今天各用一次。", "ck": ["我换着方式对最亲的人说话", "有一句关心，对方听进去了", "我少讲了一次道理，多陪了一会儿"], "pt": "《临江仙·给丁玲同志》", "pq": "昨日文小姐，今日武将军。", "plk": "昨日文小姐，今日武将军——见什么人唱什么歌，不是圆滑，是分寸。", "hook": "读了毛选我才知道，把话说进人心里，是一种温柔的能力", "pain": "同样一句关心，说法不同，有人听了暖，有人听了烦。会说话不是圆滑，是心里装着对方。", "pyq": "读了毛选我才知道，把话说进人心里，是一种温柔的能力\n\n「昨日文小姐，今日武将军。」——毛泽东《临江仙·给丁玲同志》\n\n同样一句关心，说法不同，有人听了暖，有人听了烦。会说话不是圆滑，是心里装着对方。\n\n毛选原文「射箭要看靶子，弹琴要看听众，写文章做演说倒可以不看读者不看听众吗？」\n—— 毛泽东《反对党八股》\n\n日拱一卒 · 功不唐捐"}, {"id": 16, "v": 1, "src": "《反对党八股》(1942年2月)", "q": "空话连篇，言之无物。……我们应当禁绝一切空话。", "dr": "把今天说过的大话挑出来一件，落成一个具体动作做掉它；做不完的，收回话，别再立。", "ck": ["我说到一件就做到一件", "我收回了一句兑现不了的大话", "我的话变少、事变多了"], "pt": "《七律·到韶山》", "pq": "喜看稻菽千重浪，遍地英雄下夕烟。", "plk": "稻菽千重浪才是真收成——日子要的是结果，不是漂亮的空话。", "hook": "读了毛选我才知道，话说得越漂亮，事往往做得越少", "pain": "少立flag，多做小事。嘴上的决心不值钱，手上的坚持才值钱。", "pyq": "读了毛选我才知道，话说得越漂亮，事往往做得越少\n\n「喜看稻菽千重浪，遍地英雄下夕烟。」——毛泽东《七律·到韶山》\n\n少立flag，多做小事。嘴上的决心不值钱，手上的坚持才值钱。\n\n毛选原文「空话连篇，言之无物。……我们应当禁绝一切空话。」\n—— 毛泽东《反对党八股》\n\n日拱一卒 · 功不唐捐"}, {"id": 17, "v": 1, "src": "《反对党八股》(1942年2月)", "q": "如果一篇文章，一个演说，颠来倒去，总是那几个名词，一套“学生腔”，没有一点生动活泼的语言，这岂不是语言无味，面目可憎，像个瘪三吗？", "dr": "把你最近的一件事用三句话讲给家人听：有画面、有细节、有结果，练一次「把话说到人心里」。", "ck": ["我把一件事讲出了画面感", "听的人没有走神", "我发现把话说好是可以练的"], "pt": "《七律·答友人》", "pq": "洞庭波涌连天雪，长岛人歌动地诗。", "plk": "连天雪、动地诗——语言有画面，别人才记得住；干巴巴的话说十遍也没人听。", "hook": "读了毛选我才知道，会讲故事的人，运气都不会太差", "pain": "同样是经历，讲得生动就有人愿意听。表达力，是普通人最便宜的杠杆。", "pyq": "读了毛选我才知道，会讲故事的人，运气都不会太差\n\n「洞庭波涌连天雪，长岛人歌动地诗。」——毛泽东《七律·答友人》\n\n同样是经历，讲得生动就有人愿意听。表达力，是普通人最便宜的杠杆。\n\n毛选原文「如果一篇文章，一个演说，颠来倒去，总是那几个名词，一套“学生腔”，没有一点生动活泼的语言，这岂不是语言无味，面目可憎，像个瘪三吗？」\n—— 毛泽东《反对党八股》\n\n日拱一卒 · 功不唐捐"}, {"id": 18, "v": 1, "src": "《学习和时局》(1944年4月)", "q": "放下包袱，开动机器。……所谓放下包袱，就是说，我们精神上的许多负担应该加以解除。", "dr": "写下你背得最久的一个心理包袱（一句委屈、一次丢脸），今天决定放下它，把省下的力气用在一件事上。", "ck": ["我给自己的情绪定了期限", "我写下了那个包袱", "我把省下的力气用在了正事上"], "pt": "《四言诗·奋斗》", "pq": "与天奋斗，其乐无穷！与地奋斗，其乐无穷！与人奋斗，其乐无穷！", "plk": "与天奋斗其乐无穷——包袱放下、机器开动，那股子劲儿本身就有乐子。", "hook": "读了毛选我才知道，背着昨天的委屈，走不好今天的路", "pain": "难过可以有期限，比如两天。第三天该复盘复盘，该往前走往前走——情绪解决不了问题，行动才能。", "pyq": "读了毛选我才知道，背着昨天的委屈，走不好今天的路\n\n「与天奋斗，其乐无穷！与地奋斗，其乐无穷！与人奋斗，其乐无穷！」——毛泽东《四言诗·奋斗》\n\n难过可以有期限，比如两天。第三天该复盘复盘，该往前走往前走——情绪解决不了问题，行动才能。\n\n毛选原文「放下包袱，开动机器。……所谓放下包袱，就是说，我们精神上的许多负担应该加以解除。」\n—— 毛泽东《学习和时局》\n\n日拱一卒 · 功不唐捐"}, {"id": 19, "v": 1, "src": "《实践论》(1937年7月)", "q": "认识的能动作用，不但表现于从感性的认识到理性的认识之能动的飞跃，更重要的还须表现于从理性的认识到革命的实践这一个飞跃。", "dr": "挑一条你「懂了很久却没做」的道理，今天执行它一次，并设一个七天后的提醒。", "ck": ["我把「懂」变成了「做」", "我为坚持设了提醒", "我没有再说「我都知道」"], "pt": "《蝶恋花·答李淑一》", "pq": "忽报人间曾伏虎，泪飞顿作倾盆雨。", "plk": "忽报人间曾伏虎——想到了只是图纸，干到伏虎那一天才是第二次飞跃。", "hook": "读了毛选我才知道，道理都懂和真的做到，中间差着一万次坚持", "pain": "“道理都懂，依然过不好”，因为懂只是第一步。从知道到做到，才是真正的修行。", "pyq": "读了毛选我才知道，道理都懂和真的做到，中间差着一万次坚持\n\n「忽报人间曾伏虎，泪飞顿作倾盆雨。」——毛泽东《蝶恋花·答李淑一》\n\n“道理都懂，依然过不好”，因为懂只是第一步。从知道到做到，才是真正的修行。\n\n毛选原文「认识的能动作用，不但表现于从感性的认识到理性的认识之能动的飞跃，更重要的还须表现于从理性的认识到革命的实践这一个飞跃。」\n—— 毛泽东《实践论》\n\n日拱一卒 · 功不唐捐"}, {"id": 20, "v": 1, "src": "《矛盾论》(1937年8月)", "q": "不能把过程中所有的矛盾平均看待，必须把它们区别为主要的和次要的两类，着重于捉住主要的矛盾。", "dr": "列出你正在忙的所有事，划掉一件最不值得的，把省下的时间整块给最重要那件。", "ck": ["我给事情排了主次", "我停掉了一件不重要的事", "最重要的事今天拿到了整块时间"], "pt": "《渔家傲·反第二次大“围剿”》", "pq": "横扫千军如卷席。", "plk": "横扫千军如卷席——卷席之所以快，是因为只卷一处。", "hook": "读了毛选我才知道，什么都要的人，最后什么都要不到", "pain": "时间精力就那么多，全都想抓，全都抓不牢。一年把一件事做好，就赢过了大多数人。", "pyq": "读了毛选我才知道，什么都要的人，最后什么都要不到\n\n「横扫千军如卷席。」——毛泽东《渔家傲·反第二次大“围剿”》\n\n时间精力就那么多，全都想抓，全都抓不牢。一年把一件事做好，就赢过了大多数人。\n\n毛选原文「不能把过程中所有的矛盾平均看待，必须把它们区别为主要的和次要的两类，着重于捉住主要的矛盾。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 21, "v": 1, "src": "《论持久战》(1938年5月)", "q": "中国会亡吗？答复：不会亡，最后胜利是中国的。中国能够速胜吗？答复：不能速胜，抗日战争是持久战。", "dr": "给你的一个大目标画一条「三年线」：第一年到哪儿、第二年到哪儿，今天只做第一段的第一步。", "ck": ["我不指望一口吃成胖子", "我把大目标切成了小段", "我只管今天这一小步"], "pt": "《清平乐·六盘山》", "pq": "天高云淡，望断南飞雁。", "plk": "望断南飞雁——看得远的人，才熬得过持久战。", "hook": "读了毛选我才知道，着急，是毁掉一个人最温和的方式", "pain": "人生大部分的好东西都急不来：身体、感情、本事。慢慢来，比较快。", "pyq": "读了毛选我才知道，着急，是毁掉一个人最温和的方式\n\n「天高云淡，望断南飞雁。」——毛泽东《清平乐·六盘山》\n\n人生大部分的好东西都急不来：身体、感情、本事。慢慢来，比较快。\n\n毛选原文「中国会亡吗？答复：不会亡，最后胜利是中国的。中国能够速胜吗？答复：不能速胜，抗日战争是持久战。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 22, "v": 1, "src": "《湖南农民运动考察报告》(1927年3月)", "q": "革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。", "dr": "今天把一句憋了很久的话说出来：想要的帮助、该要的说法、久违的道歉，任选其一。", "ck": ["我把想要的说出了口", "我没有等人来猜我", "说完之后，天没有塌"], "pt": "《七绝·屈原》", "pq": "屈子当年赋楚骚，手中握有杀人刀。", "plk": "屈子手中握有杀人刀——笔杆子能当刀使，你的嘴也该有这个分量。", "hook": "读了毛选我才知道，你不提要求，世界就当你没有要求", "pain": "想要就说，该争取就争取。成年人的世界里，没有人有义务猜你在想什么。", "pyq": "读了毛选我才知道，你不提要求，世界就当你没有要求\n\n「屈子当年赋楚骚，手中握有杀人刀。」——毛泽东《七绝·屈原》\n\n想要就说，该争取就争取。成年人的世界里，没有人有义务猜你在想什么。\n\n毛选原文「革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。」\n—— 毛泽东《湖南农民运动考察报告》\n\n日拱一卒 · 功不唐捐"}, {"id": 23, "v": 1, "src": "《湖南农民运动考察报告》(1927年3月)", "q": "矫枉必须过正，不过正不能矫枉。", "dr": "挑你最顽固的一个坏习惯，今天做一个「过头」的阻断动作：卸载、清空、换环境，不留后门。", "ck": ["我给坏习惯断了后路", "我今天对自己狠了一次", "我没有给自己找借口"], "pt": "《七律二首·送瘟神》", "pq": "天连五岭银锄落，地动三河铁臂摇。", "plk": "银锄落、铁臂摇——改掉老习惯得下大力气，温吞水泡不开硬土。", "hook": "读了毛选我才知道，改掉一个坏习惯，靠温和是不够的", "pain": "熬夜、拖延、乱花钱——坏习惯戒不干净，是因为总给自己留后门。对自己狠一次，胜过原谅自己一百次。", "pyq": "读了毛选我才知道，改掉一个坏习惯，靠温和是不够的\n\n「天连五岭银锄落，地动三河铁臂摇。」——毛泽东《七律二首·送瘟神》\n\n熬夜、拖延、乱花钱——坏习惯戒不干净，是因为总给自己留后门。对自己狠一次，胜过原谅自己一百次。\n\n毛选原文「矫枉必须过正，不过正不能矫枉。」\n—— 毛泽东《湖南农民运动考察报告》\n\n日拱一卒 · 功不唐捐"}, {"id": 24, "v": 1, "src": "《〈农村调查〉的序言和跋》(1941年)", "q": "没有满腔的热忱，没有眼睛向下的决心，没有求知的渴望，没有放下臭架子、甘当小学生的精神，是一定不能做，也一定做不好的。", "dr": "找一个比你懂的人（哪怕是晚辈），今天认认真真请教一个问题，记下他说的每一条。", "ck": ["我放下面子问了一个问题", "我认真听完了没有插嘴", "我记下了可用的建议"], "pt": "《采桑子·重阳》", "pq": "人生易老天难老，岁岁重阳。", "plk": "人生易老天难老——当学生的日子越长，你肚里的东西越多。", "hook": "读了毛选我才知道，把自己放低的人，反而学得最多", "pain": "混得越好，越要能听进去话。位置高一点，姿态低一点，路才宽一点。", "pyq": "读了毛选我才知道，把自己放低的人，反而学得最多\n\n「人生易老天难老，岁岁重阳。」——毛泽东《采桑子·重阳》\n\n混得越好，越要能听进去话。位置高一点，姿态低一点，路才宽一点。\n\n毛选原文「没有满腔的热忱，没有眼睛向下的决心，没有求知的渴望，没有放下臭架子、甘当小学生的精神，是一定不能做，也一定做不好的。」\n—— 毛泽东《〈农村调查〉的序言和跋》\n\n日拱一卒 · 功不唐捐"}, {"id": 25, "v": 1, "src": "《实践论》(1937年7月)", "q": "通过实践而发现真理，又通过实践而证实真理和发展真理。", "dr": "把这一卷翻一遍，挑一句今天能用上的，用一次；睡前写下「用了之后比书上多的那一层理解」。", "ck": ["我重温了这一卷并挑了一句", "我今天真的用了它", "我写下了自己的新理解"], "pt": "《沁园春·长沙》", "pq": "怅寥廓，问苍茫大地，谁主沉浮？", "plk": "谁主沉浮？——卷一的答案：认知闭环转起来的人。", "hook": "读了毛选我才知道，读过很多道理还过不好，缺的是一个“用”字", "pain": "学了不用，等于没学。用过再回头看，才真懂——人生没有白学的道理，只要你敢用。", "pyq": "读了毛选我才知道，读过很多道理还过不好，缺的是一个“用”字\n\n「怅寥廓，问苍茫大地，谁主沉浮？」——毛泽东《沁园春·长沙》\n\n学了不用，等于没学。用过再回头看，才真懂——人生没有白学的道理，只要你敢用。\n\n毛选原文「通过实践而发现真理，又通过实践而证实真理和发展真理。」\n—— 毛泽东《实践论》\n\n日拱一卒 · 功不唐捐"}, {"id": 26, "v": 2, "src": "《集中优势兵力，各个歼灭敌人》(1946年9月)", "q": "集中优势兵力、各个歼灭敌人的作战方法，不但必须应用于战役的部署方面，而且必须应用于战术的部署方面。", "dr": "看看今天的时间表，把状态最好的一小时圈出来，雷打不动给最重要的事，别的都让路。", "ck": ["我把最好的时间圈了出来", "我在这一小时里没有分心", "杂事让了路"], "pt": "《渔家傲·反第一次大“围剿”》", "pq": "万木霜天红烂漫，天兵怒气冲霄汉。", "plk": "天兵怒气冲霄汉——气势来自集中，十处冒烟不如一处起火。", "hook": "读了毛选我才知道，人生下半场，拼的是专注", "pain": "诱惑太多，选择太多，最贵的能力是舍。把最好的时间，给你最想要的那一件事。", "pyq": "读了毛选我才知道，人生下半场，拼的是专注\n\n「万木霜天红烂漫，天兵怒气冲霄汉。」——毛泽东《渔家傲·反第一次大“围剿”》\n\n诱惑太多，选择太多，最贵的能力是舍。把最好的时间，给你最想要的那一件事。\n\n毛选原文「集中优势兵力、各个歼灭敌人的作战方法，不但必须应用于战役的部署方面，而且必须应用于战术的部署方面。」\n—— 毛泽东《集中优势兵力，各个歼灭敌人》\n\n日拱一卒 · 功不唐捐"}, {"id": 27, "v": 2, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "不打无准备之仗，不打无把握之仗。", "dr": "想一件下周要面对的重要场合，今天花二十分钟把材料、说法、可能的提问各备一手。", "ck": ["我提前备了一手", "我预想了最可能被问到的问题", "我没有裸奔上场"], "pt": "《减字木兰花·广昌路上》", "pq": "漫天皆白，雪里行军情更迫。", "plk": "雪里行军靠的是出发前的准备——没准备的仗，风雪一来就散了。", "hook": "读了毛选我才知道，机会来的时候，拼的都是你之前的准备", "pain": "台上三分钟，台下十年功。平时多攒一点，关键时刻才接得住。", "pyq": "读了毛选我才知道，机会来的时候，拼的都是你之前的准备\n\n「漫天皆白，雪里行军情更迫。」——毛泽东《减字木兰花·广昌路上》\n\n台上三分钟，台下十年功。平时多攒一点，关键时刻才接得住。\n\n毛选原文「不打无准备之仗，不打无把握之仗。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 28, "v": 2, "src": "《目前形势和我们的任务》(1947年12月)", "q": "先打分散和孤立之敌，后打集中和强大之敌。", "dr": "从你的待办里挑三件最小最孤立的，今天一口气清掉，用小胜利给大难题热身。", "ck": ["我从简单的下手，没有硬啃", "今天清掉了三件小事", "我攒到了一点势"], "pt": "《清平乐·蒋桂战争》", "pq": "红旗跃过汀江，直下龙岩上杭。", "plk": "先下龙岩上杭，再图大局——从孤立的、分散的打起，一口一口吃。", "hook": "读了毛选我才知道，先易后难，不是怂，是聪明", "pain": "人生的问题别都挑硬骨头啃。先解决简单的，攒下信心和资源，难的也就不难了。", "pyq": "读了毛选我才知道，先易后难，不是怂，是聪明\n\n「红旗跃过汀江，直下龙岩上杭。」——毛泽东《清平乐·蒋桂战争》\n\n人生的问题别都挑硬骨头啃。先解决简单的，攒下信心和资源，难的也就不难了。\n\n毛选原文「先打分散和孤立之敌，后打集中和强大之敌。」\n—— 毛泽东《目前形势和我们的任务》\n\n日拱一卒 · 功不唐捐"}, {"id": 29, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "学会“弹钢琴”。弹钢琴要十个指头都动作，不能有的动，有的不动。但是，十个指头同时都按下去，那也不成调子。", "dr": "给明天的十根「指头」排个谱：哪几件必弹、哪几件轻带、哪几件今天不弹，照谱走一天。", "ck": ["我给明天排了指法", "必弹的排在了最好的时间", "我没有十个指头一起按"], "pt": "《水调歌头·游泳》", "pq": "万里长江横渡，极目楚天舒。不管风吹浪打，胜似闲庭信步。", "plk": "风吹浪打仍闲庭信步——多线不乱，是练出来的节奏感。", "hook": "读了毛选我才知道，人到中年，学会同时端稳几只碗", "pain": "工作、家庭、老人、孩子，十个指头都要动，但要有轻重缓急。乱的不是事多，是没有节奏。", "pyq": "读了毛选我才知道，人到中年，学会同时端稳几只碗\n\n「万里长江横渡，极目楚天舒。不管风吹浪打，胜似闲庭信步。」——毛泽东《水调歌头·游泳》\n\n工作、家庭、老人、孩子，十个指头都要动，但要有轻重缓急。乱的不是事多，是没有节奏。\n\n毛选原文「学会“弹钢琴”。弹钢琴要十个指头都动作，不能有的动，有的不动。但是，十个指头同时都按下去，那也不成调子。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 30, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "要“抓紧”。什么东西只有抓得很紧，毫不放松，才能抓住。抓而不紧，等于不抓。", "dr": "检查你「定过但没盯」的事，挑一件今天抓到底：办完、回话、或明确改期，不让它再悬着。", "ck": ["我抓了一件悬着的事", "我有回音、有结果", "没有再「等等看」"], "pt": "《满江红·和郭沫若同志》", "pq": "四海翻腾云水怒，五洲震荡风雷激。", "plk": "四海翻腾云水怒——抓就要抓出这个气势，温吞水等于没抓。", "hook": "读了毛选我才知道，flag 总倒，不是立得不对，是抓得不紧", "pain": "定了的事就落实，约好的时间就守住。靠谱，是这世上最高级的聪明。", "pyq": "读了毛选我才知道，flag 总倒，不是立得不对，是抓得不紧\n\n「四海翻腾云水怒，五洲震荡风雷激。」——毛泽东《满江红·和郭沫若同志》\n\n定了的事就落实，约好的时间就守住。靠谱，是这世上最高级的聪明。\n\n毛选原文「要“抓紧”。什么东西只有抓得很紧，毫不放松，才能抓住。抓而不紧，等于不抓。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 31, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "胸中有“数”。……对情况和问题一定要注意到它们的数量方面，要有基本的数量的分析。任何质量都表现为一定的数量，没有数量也就没有质量。", "dr": "记三笔账：这个月花了多少、这周大块时间去了哪、最近睡了几小时，今天把数写下来。", "ck": ["我心里有了三个数", "我没有凭感觉过日子", "数字告诉我该调什么"], "pt": "《清平乐·六盘山》", "pq": "不到长城非好汉，屈指行程二万。", "plk": "屈指行程二万——二万里是数着走完的：时间、钱、身体，心里都要有数。", "hook": "读了毛选我才知道，心里有账的人，遇事不慌", "pain": "钱花哪了、时间用哪了、身体什么状况，心里都要有个数。糊里糊涂的日子，撑不起清清楚楚的目标。", "pyq": "读了毛选我才知道，心里有账的人，遇事不慌\n\n「不到长城非好汉，屈指行程二万。」——毛泽东《清平乐·六盘山》\n\n钱花哪了、时间用哪了、身体什么状况，心里都要有个数。糊里糊涂的日子，撑不起清清楚楚的目标。\n\n毛选原文「胸中有“数”。……对情况和问题一定要注意到它们的数量方面，要有基本的数量的分析。任何质量都表现为一定的数量，没有数量也就没有质量。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 32, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "开会要事先通知，像出安民告示一样，让大家知道要讨论什么问题，早作准备。", "dr": "今天把一件别人需要提前知道的事说在前头：改约、要钱、大变化，给足对方准备时间。", "ck": ["我把话说在了前头", "对方有了准备时间", "我没有搞突然袭击"], "pt": "《浣溪沙·和柳亚子先生》", "pq": "一唱雄鸡天下白，万方乐奏有于阗。", "plk": "一唱雄鸡天下白——先把话亮在明处，后面的路才好走。", "hook": "读了毛选我才知道，有话提前说，是成年人最基本的体谅", "pain": "临时变卦、突然袭击，最伤感情。把打算说在前头，别人好安排，你也落得体面。", "pyq": "读了毛选我才知道，有话提前说，是成年人最基本的体谅\n\n「一唱雄鸡天下白，万方乐奏有于阗。」——毛泽东《浣溪沙·和柳亚子先生》\n\n临时变卦、突然袭击，最伤感情。把打算说在前头，别人好安排，你也落得体面。\n\n毛选原文「开会要事先通知，像出安民告示一样，让大家知道要讨论什么问题，早作准备。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 33, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "我们切不可强不知以为知，要“不耻下问”，要善于倾听下面干部的意见。", "dr": "今天遇到不懂的事，当场问掉，不许用「回去查查」糊弄过去；问完说声谢谢。", "ck": ["我当场问了，没有装懂", "我得到了真答案而不是猜测", "我问完道了谢"], "pt": "《七律·和周世钊同志》", "pq": "春江浩荡暂徘徊，又踏层峰望眼开。", "plk": "又踏层峰望眼开——不懂就问，问一次，眼前就开一层。", "hook": "读了毛选我才知道，敢问路的人，才不走冤枉路", "pain": "不懂装懂，吃的是暗亏。放下面子问一句，胜过熬夜摸索一整晚。", "pyq": "读了毛选我才知道，敢问路的人，才不走冤枉路\n\n「春江浩荡暂徘徊，又踏层峰望眼开。」——毛泽东《七律·和周世钊同志》\n\n不懂装懂，吃的是暗亏。放下面子问一句，胜过熬夜摸索一整晚。\n\n毛选原文「我们切不可强不知以为知，要“不耻下问”，要善于倾听下面干部的意见。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 34, "v": 2, "src": "《党委会的工作方法》(1949年3月)", "q": "划清两种界限。首先，是革命还是反革命？……其次，在革命的队伍中，要划清正确和错误、成绩和缺点的界限。", "dr": "想一件最近的不愉快，把它拆成「事」和「人」两栏：事错在哪、人无关哪，今天只谈事。", "ck": ["我把事和人分开了", "我批评了事，没有伤人", "我没有翻旧账"], "pt": "《七律·人民解放军占领南京》", "pq": "天若有情天亦老，人间正道是沧桑。", "plk": "人间正道是沧桑——把矛盾搅在一起就乱，划清界限才看得见正道。", "hook": "读了毛选我才知道，把事和人分开，是成熟的开始", "pain": "批评他的事，不否定他的人；不同意你的观点，不等于看不上你。界限清楚了，争吵就少了。", "pyq": "读了毛选我才知道，把事和人分开，是成熟的开始\n\n「天若有情天亦老，人间正道是沧桑。」——毛泽东《七律·人民解放军占领南京》\n\n批评他的事，不否定他的人；不同意你的观点，不等于看不上你。界限清楚了，争吵就少了。\n\n毛选原文「划清两种界限。首先，是革命还是反革命？……其次，在革命的队伍中，要划清正确和错误、成绩和缺点的界限。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 35, "v": 2, "src": "《关于领导方法的若干问题》(1943年6月)", "q": "我们共产党人无论进行何项工作，有两个方法是必须采用的，一是一般和个别相结合，二是领导和群众相结合。", "dr": "你劝过很多次没人动的那件事，今天自己做一遍给对方看，或者陪他一起做一次。", "ck": ["我示范了一次", "我陪对方做了一遍", "我没有只动嘴"], "pt": "《七律·到韶山》", "pq": "红旗卷起农奴戟，黑手高悬霸主鞭。", "plk": "红旗卷起农奴戟——号召要落地，还得一把一把教人怎么握戟。", "hook": "读了毛选我才知道，讲一百遍道理，不如陪他做一遍", "pain": "要求家人做到的，不如带着他做一次。陪伴，是最有力的教育。", "pyq": "读了毛选我才知道，讲一百遍道理，不如陪他做一遍\n\n「红旗卷起农奴戟，黑手高悬霸主鞭。」——毛泽东《七律·到韶山》\n\n要求家人做到的，不如带着他做一次。陪伴，是最有力的教育。\n\n毛选原文「我们共产党人无论进行何项工作，有两个方法是必须采用的，一是一般和个别相结合，二是领导和群众相结合。」\n—— 毛泽东《关于领导方法的若干问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 36, "v": 2, "src": "《关于领导方法的若干问题》(1943年6月)", "q": "将群众的意见集中起来，又到群众中去作宣传解释，化为群众的意见，使群众坚持下去，见之于行动……如此无限循环，一次比一次地更正确、更生动、更丰富。", "dr": "一个悬而未决的打算，今天说给家人或老友听，收集三条真实反应，再回头修你的想法。", "ck": ["我把想法拿到了生活里检验", "我听到了三条真实反馈", "我修了至少一处"], "pt": "《水调歌头·游泳》", "pq": "才饮长沙水，又食武昌鱼。", "plk": "才饮长沙水，又食武昌鱼——走到真实的生活里，主意才有味道。", "hook": "读了毛选我才知道，好的决定，都长在生活里", "pain": "关在屋里想不出好答案。多听听家人怎么说、看看日子怎么过，决定才接地气。", "pyq": "读了毛选我才知道，好的决定，都长在生活里\n\n「才饮长沙水，又食武昌鱼。」——毛泽东《水调歌头·游泳》\n\n关在屋里想不出好答案。多听听家人怎么说、看看日子怎么过，决定才接地气。\n\n毛选原文「将群众的意见集中起来，又到群众中去作宣传解释，化为群众的意见，使群众坚持下去，见之于行动……如此无限循环，一次比一次地更正确、更生动、更丰富。」\n—— 毛泽东《关于领导方法的若干问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 37, "v": 2, "src": "《关心群众生活，注意工作方法》(1934年1月)", "q": "就得和群众在一起，就得去发动群众的积极性，就得关心群众的痛痒，就得真心实意地为群众谋利益，解决群众的生产和生活的问题。", "dr": "挑一个你在乎的人，今天做一件他真正需要的实事（不是客套）：跑一趟腿、办一件小事。", "ck": ["我帮到了点子上", "对方真的省了事", "我没图一句谢谢"], "pt": "《卜算子·咏梅》", "pq": "俏也不争春，只把春来报。待到山花烂漫时，她在丛中笑。", "plk": "待到山花烂漫时，她在丛中笑——真心待人的人，笑在最后。", "hook": "读了毛选我才知道，真心为别人好的人，别人都看得见", "pain": "帮人帮到点子上，胜过嘴上客气一万句。你为别人着想的每一分，最后都会回到你身上。", "pyq": "读了毛选我才知道，真心为别人好的人，别人都看得见\n\n「俏也不争春，只把春来报。待到山花烂漫时，她在丛中笑。」——毛泽东《卜算子·咏梅》\n\n帮人帮到点子上，胜过嘴上客气一万句。你为别人着想的每一分，最后都会回到你身上。\n\n毛选原文「就得和群众在一起，就得去发动群众的积极性，就得关心群众的痛痒，就得真心实意地为群众谋利益，解决群众的生产和生活的问题。」\n—— 毛泽东《关心群众生活，注意工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 38, "v": 2, "src": "《关心群众生活，注意工作方法》(1934年1月)", "q": "我们不但要提出任务，而且要解决完成任务的方法问题。我们的任务是过河，但是没有桥或没有船就不能过。不解决桥或船的问题，过河就是一句空话。", "dr": "给你的目标装上「桥」：一个具体时间、一个具体地点、一个具体工具，今天把三样写全。", "ck": ["我的目标有了桥和船", "时间、地点、工具三样齐", "我不再只靠意志力"], "pt": "《水调歌头·游泳》", "pq": "一桥飞架南北，天堑变通途。", "plk": "天堑变通途靠的是桥和船——任务越是过河，方法越不能空谈。", "hook": "读了毛选我才知道，目标写在纸上没用，得找到那条船", "pain": "想减肥就定好每周三次的时间，想读书就把书摆上枕边。过河靠的是船，不是许愿。", "pyq": "读了毛选我才知道，目标写在纸上没用，得找到那条船\n\n「一桥飞架南北，天堑变通途。」——毛泽东《水调歌头·游泳》\n\n想减肥就定好每周三次的时间，想读书就把书摆上枕边。过河靠的是船，不是许愿。\n\n毛选原文「我们不但要提出任务，而且要解决完成任务的方法问题。我们的任务是过河，但是没有桥或没有船就不能过。不解决桥或船的问题，过河就是一句空话。」\n—— 毛泽东《关心群众生活，注意工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 39, "v": 2, "src": "《必须注意经济工作》(1933年8月)", "q": "经济建设必须是环绕着革命战争这个中心任务的。", "dr": "顺风的时候做一笔「顺境储蓄」：存一笔小钱、约一次老友、早睡一晚，今天选一样落实。", "ck": ["我在顺境里存了一点底", "我没有把好日子过成透支", "存钱、人情、身体，我落实了一样"], "pt": "《七律·登庐山》", "pq": "陶令不知何处去，桃花源里可耕田。", "plk": "桃花源里可耕田——仗打完了要种地：抓单子，也要抓经营。", "hook": "读了毛选我才知道，风光的时候，别忘了过日子", "pain": "高光时别透支，顺境时多储蓄——钱要存，情要存，身体更要存。日子，是长期经营。", "pyq": "读了毛选我才知道，风光的时候，别忘了过日子\n\n「陶令不知何处去，桃花源里可耕田。」——毛泽东《七律·登庐山》\n\n高光时别透支，顺境时多储蓄——钱要存，情要存，身体更要存。日子，是长期经营。\n\n毛选原文「经济建设必须是环绕着革命战争这个中心任务的。」\n—— 毛泽东《必须注意经济工作》\n\n日拱一卒 · 功不唐捐"}, {"id": 40, "v": 2, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "我们的眼力不够，应该借助于望远镜和显微镜。马克思主义的方法就是政治上军事上的望远镜和显微镜。", "dr": "十分钟望远（一年后想过什么日子）加十分钟看细（今天一件具体小事做到位），两样都做。", "ck": ["我抬头看了远处的路", "我低头把一件小事做细", "远和近今天都照顾到了"], "pt": "《沁园春·雪》", "pq": "北国风光，千里冰封，万里雪飘。", "plk": "千里冰封是望远镜，万里雪飘是显微镜——远近都看得见，才叫有全局。", "hook": "读了毛选我才知道，既要抬头看路，也要低头看脚", "pain": "只看远方会踩坑，只看脚下会迷路。眼光和踏实，一样都不能少。", "pyq": "读了毛选我才知道，既要抬头看路，也要低头看脚\n\n「北国风光，千里冰封，万里雪飘。」——毛泽东《沁园春·雪》\n\n只看远方会踩坑，只看脚下会迷路。眼光和踏实，一样都不能少。\n\n毛选原文「我们的眼力不够，应该借助于望远镜和显微镜。马克思主义的方法就是政治上军事上的望远镜和显微镜。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 41, "v": 2, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "指挥全局的人，最要紧的，是把自己的注意力摆在照顾战争的全局上面。", "dr": "有一场你「必须赢」的小争执吗？今天主动退半步，把关系这盘棋摆回棋盘中央。", "ck": ["我看了一回全局", "我放下了一局输赢", "重要的事还留在桌上"], "pt": "《念奴娇·昆仑》", "pq": "安得倚天抽宝剑，把汝裁为三截？", "plk": "安得倚天抽宝剑，把汝裁为三截——全局在胸，才敢下手切分。", "hook": "读了毛选我才知道，赢了一局输了一盘，是人生最亏的买卖", "pain": "为小事跟家人赌气，为面子跟朋友翻脸——赢了道理，输了感情。棋盘，比棋子大。", "pyq": "读了毛选我才知道，赢了一局输了一盘，是人生最亏的买卖\n\n「安得倚天抽宝剑，把汝裁为三截？」——毛泽东《念奴娇·昆仑》\n\n为小事跟家人赌气，为面子跟朋友翻脸——赢了道理，输了感情。棋盘，比棋子大。\n\n毛选原文「指挥全局的人，最要紧的，是把自己的注意力摆在照顾战争的全局上面。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 42, "v": 2, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "战略退却，是劣势军队处在优势军队进攻面前，因为顾到不能迅速地击破其进攻，为了保存军力，待机破敌，而采取的一个有计划的战略步骤。", "dr": "挑一个正在消耗你的局（群、饭局、争辩），今天体面退半步，把省下的力气记给正事。", "ck": ["我从消耗里退了一步", "我没有觉得丢脸", "力气省给了值得的事"], "pt": "《七律·和柳亚子先生》", "pq": "莫道昆明池水浅，观鱼胜过富春江。", "plk": "莫道昆明池水浅——退一步不是认输，是换个地方看鱼。", "hook": "读了毛选我才知道，学会认输，是成年人的必修课", "pain": "打不赢的架不打，融不进的圈子不融。退一步不是认怂，是把力气留给值得的地方。", "pyq": "读了毛选我才知道，学会认输，是成年人的必修课\n\n「莫道昆明池水浅，观鱼胜过富春江。」——毛泽东《七律·和柳亚子先生》\n\n打不赢的架不打，融不进的圈子不融。退一步不是认怂，是把力气留给值得的地方。\n\n毛选原文「战略退却，是劣势军队处在优势军队进攻面前，因为顾到不能迅速地击破其进攻，为了保存军力，待机破敌，而采取的一个有计划的战略步骤。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 43, "v": 2, "src": "《论持久战》(1938年5月)", "q": "行动自由是军队的命脉，失了这种自由，军队就接近于被打败或被消灭。", "dr": "给自己留一格「自由仓」：钱上留一笔不动款、日程留一小时空白，今天至少落实一样。", "ck": ["我给自己留了余地", "我没有把日程塞满", "转身的空间多了一格"], "pt": "《渔家傲·反第二次大“围剿”》", "pq": "白云山头云欲立，白云山下呼声急。", "plk": "白云山下呼声急——主动权在手的人，永远在制造声势。", "hook": "读了毛选我才知道，把主动权握在自己手里，日子才不憋屈", "pain": "经济上留点余钱，时间上留点空白，关系上留点分寸。不把自己逼到墙角，人生才有转身的余地。", "pyq": "读了毛选我才知道，把主动权握在自己手里，日子才不憋屈\n\n「白云山头云欲立，白云山下呼声急。」——毛泽东《渔家傲·反第二次大“围剿”》\n\n经济上留点余钱，时间上留点空白，关系上留点分寸。不把自己逼到墙角，人生才有转身的余地。\n\n毛选原文「行动自由是军队的命脉，失了这种自由，军队就接近于被打败或被消灭。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 44, "v": 2, "src": "《论持久战》(1938年5月)", "q": "兵民是胜利之本。", "dr": "给三个平时帮过你的人各发一句真诚问候，不为办事，就为记得他们。", "ck": ["我记起了三个该谢的人", "我发出了问候，不谈事", "我的「群众基础」厚了一层"], "pt": "《杂言诗·八连颂》", "pq": "军民团结如一人，试看天下谁能敌。", "plk": "军民团结如一人——你的群众基础，就是平日肯替你说话的人。", "hook": "读了毛选我才知道，你平时待人的样子，就是你落难时的运气", "pain": "平时多帮人、多结善缘，难的时候才有人拉你。人心，是这世上最硬的底牌。", "pyq": "读了毛选我才知道，你平时待人的样子，就是你落难时的运气\n\n「军民团结如一人，试看天下谁能敌。」——毛泽东《杂言诗·八连颂》\n\n平时多帮人、多结善缘，难的时候才有人拉你。人心，是这世上最硬的底牌。\n\n毛选原文「兵民是胜利之本。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 45, "v": 2, "src": "《抗日游击战争的战略问题》(1938年5月)", "q": "防御中的进攻，持久中的速决，内线中的外线。", "dr": "挑你「守成」的一个领域（健康、手艺、关系），今天主动出击一步：学一点新的，或练一次旧的。", "ck": ["我没有只守不攻", "我在老本行里学了点新", "我的阵地今天更稳了"], "pt": "《西江月·井冈山》", "pq": "黄洋界上炮声隆，报道敌军宵遁。", "plk": "黄洋界上炮声隆——守着阵地打出的这一炮，比追着敌人跑更响。", "hook": "读了毛选我才知道，守得住的才叫安稳，守不住的那叫侥幸", "pain": "感情要经营，身体要锻炼，本事要更新。人生没有一劳永逸，只有天天升级。", "pyq": "读了毛选我才知道，守得住的才叫安稳，守不住的那叫侥幸\n\n「黄洋界上炮声隆，报道敌军宵遁。」——毛泽东《西江月·井冈山》\n\n感情要经营，身体要锻炼，本事要更新。人生没有一劳永逸，只有天天升级。\n\n毛选原文「防御中的进攻，持久中的速决，内线中的外线。」\n—— 毛泽东《抗日游击战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 46, "v": 2, "src": "《目前形势和我们的任务》(1947年12月)", "q": "先取小城市、中等城市和广大乡村，后取大城市。", "dr": "把一件你嫌小不想做的小事，今天做到漂漂亮亮，做完再看看心态有什么不同。", "ck": ["我把小事做漂亮了", "我没有挑活儿", "台阶又垒了一级"], "pt": "《清平乐·蒋桂战争》", "pq": "收拾金瓯一片，分田分地真忙。", "plk": "先收拾金瓯一片——小城小单不是将就，是台阶。", "hook": "读了毛选我才知道，小事做漂亮的人，才轮得到做大事", "pain": "别嫌弃眼前的小事，它们是大事的台阶。把手头每件事做到位，机会自然会看见你。", "pyq": "读了毛选我才知道，小事做漂亮的人，才轮得到做大事\n\n「收拾金瓯一片，分田分地真忙。」——毛泽东《清平乐·蒋桂战争》\n\n别嫌弃眼前的小事，它们是大事的台阶。把手头每件事做到位，机会自然会看见你。\n\n毛选原文「先取小城市、中等城市和广大乡村，后取大城市。」\n—— 毛泽东《目前形势和我们的任务》\n\n日拱一卒 · 功不唐捐"}, {"id": 47, "v": 2, "src": "《目前形势和我们的任务》(1947年12月)", "q": "力求在运动中歼灭敌人。", "dr": "有一件你「等时机」的事吗？今天不等了：出门、打电话、先做起来，让事情动起来。", "ck": ["我让一件事动了起来", "我没有再等「合适的时候」", "今天比昨天多了动静"], "pt": "《六言诗·给彭德怀同志》", "pq": "山高路远坑深，大军纵横驰奔。谁敢横刀立马？唯我彭大将军！", "plk": "大军纵横驰奔——动起来打才叫痛快，停下来等，机会就凉了。", "hook": "读了毛选我才知道，机会不是等来的，是走出来的", "pain": "宅着刷手机，好运不会敲门。人生的转机，都藏在你走出门的路上。", "pyq": "读了毛选我才知道，机会不是等来的，是走出来的\n\n「山高路远坑深，大军纵横驰奔。谁敢横刀立马？唯我彭大将军！」——毛泽东《六言诗·给彭德怀同志》\n\n宅着刷手机，好运不会敲门。人生的转机，都藏在你走出门的路上。\n\n毛选原文「力求在运动中歼灭敌人。」\n—— 毛泽东《目前形势和我们的任务》\n\n日拱一卒 · 功不唐捐"}, {"id": 48, "v": 2, "src": "《组织起来》(1943年11月)", "q": "我们应该走到群众中间去，向群众学习，把他们的经验综合起来，成为更好的有条理的道理和办法。", "dr": "你的某个想法缺人缺资源？今天拉一个群或约一个人，把第一块拼图拼上。", "ck": ["我把散着的资源拢了拢", "我找到了第一个同行的人", "搭台比单干有劲"], "pt": "《渔家傲·反第一次大“围剿”》", "pq": "唤起工农千百万，同心干，不周山下红旗乱。", "plk": "唤起工农千百万，同心干——资源不组织，就只是一堆散着的名字。", "hook": "读了毛选我才知道，一个人走得快，一群人走得远", "pain": "把朋友组织起来、把资源盘活起来，互相搭台，好过彼此拆台。独行快，众行远。", "pyq": "读了毛选我才知道，一个人走得快，一群人走得远\n\n「唤起工农千百万，同心干，不周山下红旗乱。」——毛泽东《渔家傲·反第一次大“围剿”》\n\n把朋友组织起来、把资源盘活起来，互相搭台，好过彼此拆台。独行快，众行远。\n\n毛选原文「我们应该走到群众中间去，向群众学习，把他们的经验综合起来，成为更好的有条理的道理和办法。」\n—— 毛泽东《组织起来》\n\n日拱一卒 · 功不唐捐"}, {"id": 49, "v": 2, "src": "《党内通信》(1959年4月)", "q": "老实人，敢讲真话的人，归根到底，于人民事业有利，于自己也不吃亏。爱讲假话的人，一害人民，二害自己，总是吃亏。", "dr": "今天有一句想粉饰的话吗？挑出来，把实情平和地说了，接受它带来的小小不适。", "ck": ["我说了一句实话", "我没有用谎圆谎", "今晚睡得踏实"], "pt": "《七律·到韶山》", "pq": "为有牺牲多壮志，敢教日月换新天。", "plk": "敢教日月换新天——敢说真话，先得有敢担代价的胆。", "hook": "读了毛选我才知道，说真话可能吃亏一时，说假话一定吃亏一世", "pain": "一句谎话要用十个谎来圆，太累。实话实说的人，睡得着觉，走得长远。", "pyq": "读了毛选我才知道，说真话可能吃亏一时，说假话一定吃亏一世\n\n「为有牺牲多壮志，敢教日月换新天。」——毛泽东《七律·到韶山》\n\n一句谎话要用十个谎来圆，太累。实话实说的人，睡得着觉，走得长远。\n\n毛选原文「老实人，敢讲真话的人，归根到底，于人民事业有利，于自己也不吃亏。爱讲假话的人，一害人民，二害自己，总是吃亏。」\n—— 毛泽东《党内通信》\n\n日拱一卒 · 功不唐捐"}, {"id": 50, "v": 2, "src": "《关心群众生活，注意工作方法》(1934年1月)", "q": "真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。", "dr": "数一数你真心帮过的人，给其中一个再帮一次小的；若一时想不起，今天开始存第一笔「炭」。", "ck": ["我盘点了自己的「铜墙铁壁」", "我又送了一次炭", "人心存折加了余额"], "pt": "《浪淘沙·北戴河》", "pq": "萧瑟秋风今又是，换了人间。", "plk": "萧瑟秋风今又是，换了人间——方法用到底，市场就换了模样。", "hook": "读了毛选我才知道，你帮过的人，才是你真正的靠山", "pain": "存款会贬值，人脉不会——前提是你真心帮过别人。雪中送过的炭，会变成你寒冬里的火。", "pyq": "读了毛选我才知道，你帮过的人，才是你真正的靠山\n\n「萧瑟秋风今又是，换了人间。」——毛泽东《浪淘沙·北戴河》\n\n存款会贬值，人脉不会——前提是你真心帮过别人。雪中送过的炭，会变成你寒冬里的火。\n\n毛选原文「真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。」\n—— 毛泽东《关心群众生活，注意工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 51, "v": 3, "src": "《论持久战》(1938年5月)", "q": "第一个阶段，是敌之战略进攻、我之战略防御的时期。第二个阶段，是敌之战略保守、我之准备反攻的时期。第三个阶段，是我之战略反攻、敌之战略退却的时期。", "dr": "判断你人生此刻的阶段：攒本事期、熬相持期还是收成期，按阶段给今天排一件对的事。", "ck": ["我知道自己处在哪一段", "我做了这个阶段该做的事", "我没有用错季节的活法"], "pt": "《念奴娇·昆仑》", "pq": "横空出世，莽昆仑，阅尽人间春色。", "plk": "莽昆仑阅尽人间春色——看清自己在哪一段，才知道下一步往哪走。", "hook": "读了毛选我才知道，人生每个阶段，有每个阶段的活法", "pain": "二十岁别怕试错，三十岁别怕扎根，四十岁别怕做减法。阶段错了，再努力也是错。", "pyq": "读了毛选我才知道，人生每个阶段，有每个阶段的活法\n\n「横空出世，莽昆仑，阅尽人间春色。」——毛泽东《念奴娇·昆仑》\n\n二十岁别怕试错，三十岁别怕扎根，四十岁别怕做减法。阶段错了，再努力也是错。\n\n毛选原文「第一个阶段，是敌之战略进攻、我之战略防御的时期。第二个阶段，是敌之战略保守、我之准备反攻的时期。第三个阶段，是我之战略反攻、敌之战略退却的时期。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 52, "v": 3, "src": "《星星之火，可以燎原》(1930年1月)", "q": "它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿。", "dr": "点你的第一粒火种：一篇短文、一笔小存款、一个习惯的第一天，小到不可能失败，今天点着。", "ck": ["我的火种今天点着了", "它小到我不可能失败", "我相信它会燎原"], "pt": "《如梦令·元旦》", "pq": "山下山下，风展红旗如画。", "plk": "风展红旗如画——一面旗插下去，看着看着就漫山遍野了。", "hook": "读了毛选我才知道，别小看你的第一次尝试", "pain": "第一篇文章、第一笔存款、第一个好习惯——人生的燎原，都是从一点微光开始的。", "pyq": "读了毛选我才知道，别小看你的第一次尝试\n\n「山下山下，风展红旗如画。」——毛泽东《如梦令·元旦》\n\n第一篇文章、第一笔存款、第一个好习惯——人生的燎原，都是从一点微光开始的。\n\n毛选原文「它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，它是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日，它是躁动于母腹中的快要成熟了的一个婴儿。」\n—— 毛泽东《星星之火，可以燎原》\n\n日拱一卒 · 功不唐捐"}, {"id": 53, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "集中兵力看来容易，实行颇难。人人皆知以多胜少是最好的办法，然而很多人不能做，相反地每每分散兵力，原因就在于指导者缺乏战略头脑，为复杂的环境所迷惑。", "dr": "做一次小减法：删一个 app、退一个群、送走一件闲置，今天腾出一块地方。", "ck": ["我舍掉了一样东西", "我没有心疼太久", "重要的东西有了位置"], "pt": "《十六字令三首》", "pq": "山，倒海翻江卷巨澜。奔腾急，万马战犹酣。", "plk": "万马战犹酣，但不能到处都是战场——舍得撤兵，才叫会打仗。", "hook": "读了毛选我才知道，舍不得，让人生越来越满、也越来越乱", "pain": "旧物、旧情、旧习惯，该舍就舍。人生做减法不是失去，是腾地方给真正重要的东西。", "pyq": "读了毛选我才知道，舍不得，让人生越来越满、也越来越乱\n\n「山，倒海翻江卷巨澜。奔腾急，万马战犹酣。」——毛泽东《十六字令三首》\n\n旧物、旧情、旧习惯，该舍就舍。人生做减法不是失去，是腾地方给真正重要的东西。\n\n毛选原文「集中兵力看来容易，实行颇难。人人皆知以多胜少是最好的办法，然而很多人不能做，相反地每每分散兵力，原因就在于指导者缺乏战略头脑，为复杂的环境所迷惑。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 54, "v": 3, "src": "《论持久战》(1938年5月)", "q": "古人所谓'运用之妙，存乎一心'，这个'妙'，我们叫做灵活性，是聪明的指挥员的出智慧的产物。", "dr": "挑一条别人推荐的做法（早起、健身、存钱），按你的作息改造它，今天用改良版试一次。", "ck": ["我把别人的方法本地化了", "改良版今天试过了", "适合自己的才立得住"], "pt": "《沁园春·雪》", "pq": "江山如此多娇，引无数英雄竞折腰。", "plk": "英雄竞折腰，各有各的打法——妙处在于，你用的是自己的那一套。", "hook": "读了毛选我才知道，活学活用，日子才过得灵动", "pain": "别人家的经验、书上的道理，都要过一遍自己的日子再采用。生活没有标准答案，合适最好。", "pyq": "读了毛选我才知道，活学活用，日子才过得灵动\n\n「江山如此多娇，引无数英雄竞折腰。」——毛泽东《沁园春·雪》\n\n别人家的经验、书上的道理，都要过一遍自己的日子再采用。生活没有标准答案，合适最好。\n\n毛选原文「古人所谓'运用之妙，存乎一心'，这个'妙'，我们叫做灵活性，是聪明的指挥员的出智慧的产物。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 55, "v": 3, "src": "《抗日游击战争的战略问题》(1938年5月)", "q": "游击战争的根据地是什么呢？它是游击战争赖以执行自己的战略任务，达到保存和发展自己、消灭和驱逐敌人之目的的战略基地。", "dr": "经营你的根据地：收拾一个角落、赴一场老友约、浇一次你的花，今天给它添一块砖。", "ck": ["我的根据地今天更扎实了", "我有一个能歇脚的地方", "歇好了，能再出发"], "pt": "《西江月·秋收起义》", "pq": "军叫工农革命，旗号镰刀斧头。……地主重重压迫，农民个个同仇。", "plk": "军叫工农革命，旗号镰刀斧头——根据地先有旗，才聚得起人。", "hook": "读了毛选我才知道，人这一辈子，得有一个自己的角落", "pain": "一个爱好、一间小屋、几个老友——那是你的根据地。外面的风浪再大，回来能歇，就能再出发。", "pyq": "读了毛选我才知道，人这一辈子，得有一个自己的角落\n\n「军叫工农革命，旗号镰刀斧头。……地主重重压迫，农民个个同仇。」——毛泽东《西江月·秋收起义》\n\n一个爱好、一间小屋、几个老友——那是你的根据地。外面的风浪再大，回来能歇，就能再出发。\n\n毛选原文「游击战争的根据地是什么呢？它是游击战争赖以执行自己的战略任务，达到保存和发展自己、消灭和驱逐敌人之目的的战略基地。」\n—— 毛泽东《抗日游击战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 56, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "敌进我退，敌驻我扰，敌疲我打，敌退我追。", "dr": "看看你最大的那件难事处在哪一拍：该进就推一步，该守就稳住，该退就放手，今天按拍子来。", "ck": ["我听清了自己的节奏", "该进的我进了半步", "我不跟拍子较劲"], "pt": "《念奴娇·鸟儿问答》", "pq": "鲲鹏展翅九万里，翻动扶摇羊角。", "plk": "鲲鹏展翅九万里靠的是借势——退与进、快与慢，借的是生活本身的势。", "hook": "读了毛选我才知道，跟生活过招，也讲进退节奏", "pain": "顺境时进攻，逆境时蛰伏；该坚持时咬牙，该转弯时放手。懂节奏的人，日子过得从容。", "pyq": "读了毛选我才知道，跟生活过招，也讲进退节奏\n\n「鲲鹏展翅九万里，翻动扶摇羊角。」——毛泽东《念奴娇·鸟儿问答》\n\n顺境时进攻，逆境时蛰伏；该坚持时咬牙，该转弯时放手。懂节奏的人，日子过得从容。\n\n毛选原文「敌进我退，敌驻我扰，敌疲我打，敌退我追。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 57, "v": 3, "src": "《目前形势和我们的任务》(1947年12月)", "q": "以俘获敌人的全部武器和大部人员，补充自己。我军人力物力的来源，主要在前线。", "dr": "把今天遇到的一件事（成或败）当场「缴获」一样东西：一个教训、一个方法、一个提醒。", "ck": ["我没有白过今天", "我从现场带回了一条弹药", "教训变成了库存"], "pt": "《水调歌头·游泳》", "pq": "更立西江石壁，截断巫山云雨，高峡出平湖。", "plk": "截断巫山云雨，高峡出平湖——资源就在眼前，看你改不改得动。", "hook": "读了毛选我才知道，生活给你的反馈，是最真实的教材", "pain": "吃过一次亏，长一分心智；得过一次助，懂一分感恩。人生的课堂在生活里，不在书本里。", "pyq": "读了毛选我才知道，生活给你的反馈，是最真实的教材\n\n「更立西江石壁，截断巫山云雨，高峡出平湖。」——毛泽东《水调歌头·游泳》\n\n吃过一次亏，长一分心智；得过一次助，懂一分感恩。人生的课堂在生活里，不在书本里。\n\n毛选原文「以俘获敌人的全部武器和大部人员，补充自己。我军人力物力的来源，主要在前线。」\n—— 毛泽东《目前形势和我们的任务》\n\n日拱一卒 · 功不唐捐"}, {"id": 58, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "指挥员的正确的部署来源于正确的决心，正确的决心来源于正确的判断，正确的判断来源于周到的和必要的侦察，和对于各种侦察材料的联贯起来的思索。", "dr": "面前若有大决定，今天只做侦察不做决定：问两个过来人、查三份资料，明天再想。", "ck": ["我先侦察，后决心", "我多了两条一手信息", "我没有在冲动里拍板"], "pt": "《七律·吊罗荣桓同志》", "pq": "长征不是难堪日，战锦方为大问题。", "plk": "战锦方为大问题——关键不在走了多远，而在要紧处判断得准不准。", "hook": "读了毛选我才知道，重要的决定之前，先别急着下结论", "pain": "换工作、买房子、大额支出——多打听、多看看、多想想。冲动的代价，往往要用很多年偿还。", "pyq": "读了毛选我才知道，重要的决定之前，先别急着下结论\n\n「长征不是难堪日，战锦方为大问题。」——毛泽东《七律·吊罗荣桓同志》\n\n换工作、买房子、大额支出——多打听、多看看、多想想。冲动的代价，往往要用很多年偿还。\n\n毛选原文「指挥员的正确的部署来源于正确的决心，正确的决心来源于正确的判断，正确的判断来源于周到的和必要的侦察，和对于各种侦察材料的联贯起来的思索。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 59, "v": 3, "src": "《论联合政府》(1945年4月)", "q": "没有一个人民的军队，便没有人民的一切。", "dr": "翻出你答应过却没办的一件事，今天办掉它，或给出明确时间——让自己的话重新有分量。", "ck": ["我兑现了一个承诺", "我的话重新有了分量", "里子比面子重要"], "pt": "《浪淘沙·北戴河》", "pq": "大雨落幽燕，白浪滔天，秦皇岛外打鱼船。", "plk": "大雨落幽燕，白浪滔天——把手上的事做扎实的气势，就是一个人的底气。", "hook": "读了毛选我才知道，面子是嘴上的，里子是手上的", "pain": "把答应家人的事一件件兑现，比任何承诺都动人。说得好听，不如做得踏实。", "pyq": "读了毛选我才知道，面子是嘴上的，里子是手上的\n\n「大雨落幽燕，白浪滔天，秦皇岛外打鱼船。」——毛泽东《浪淘沙·北戴河》\n\n把答应家人的事一件件兑现，比任何承诺都动人。说得好听，不如做得踏实。\n\n毛选原文「没有一个人民的军队，便没有人民的一切。」\n—— 毛泽东《论联合政府》\n\n日拱一卒 · 功不唐捐"}, {"id": 60, "v": 3, "src": "《中国社会各阶级的分析》(1925年12月)", "q": "谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。", "dr": "写下三个「风雨里会撑伞」的名字，今天给其中一个打个电话，聊聊近况。", "ck": ["我认得出自己的盟友", "我给盟友打了一个电话", "关系是走出来的"], "pt": "《七律·人民解放军占领南京》", "pq": "钟山风雨起苍黄，百万雄师过大江。", "plk": "百万雄师过大江——一个人是兵，一群人是势：把盟友聚成百万雄师。", "hook": "读了毛选我才知道，这一生，要交几个能交底的朋友", "pain": "酒肉朋友一堆，不如知己两三个。平日里多走动，风雨里才有人撑伞。", "pyq": "读了毛选我才知道，这一生，要交几个能交底的朋友\n\n「钟山风雨起苍黄，百万雄师过大江。」——毛泽东《七律·人民解放军占领南京》\n\n酒肉朋友一堆，不如知己两三个。平日里多走动，风雨里才有人撑伞。\n\n毛选原文「谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。」\n—— 毛泽东《中国社会各阶级的分析》\n\n日拱一卒 · 功不唐捐"}, {"id": 61, "v": 3, "src": "《〈共产党人〉发刊词》(1939年10月)", "q": "统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。", "dr": "给圈子、本事、身体各打一分，找出最低的那项，今天为它做一件补短板的事。", "ck": ["我给三样打了分", "我找到了最短板", "短板今天补了一块"], "pt": "《沁园春·长沙》", "pq": "恰同学少年，风华正茂；书生意气，挥斥方遒。", "plk": "恰同学少年，风华正茂——圈子、本事、身体三样齐备，就是人生最好的年纪。", "hook": "读了毛选我才知道，人到中年，拼的是圈子、本事和身体", "pain": "圈子给你机会，本事给你底气，身体给你本钱。三样都不缺的人，日子差不到哪去。", "pyq": "读了毛选我才知道，人到中年，拼的是圈子、本事和身体\n\n「恰同学少年，风华正茂；书生意气，挥斥方遒。」——毛泽东《沁园春·长沙》\n\n圈子给你机会，本事给你底气，身体给你本钱。三样都不缺的人，日子差不到哪去。\n\n毛选原文「统一战线，武装斗争，党的建设，是中国共产党在中国革命中战胜敌人的三个法宝，三个主要的法宝。」\n—— 毛泽东《〈共产党人〉发刊词》\n\n日拱一卒 · 功不唐捐"}, {"id": 62, "v": 3, "src": "《矛盾论》(1937年8月)", "q": "不同质的矛盾，只有用不同质的方法才能解决。", "dr": "挑一段你想改善的关系，今天换一把钥匙：换一种他吃的方式，再试一次。", "ck": ["我换了钥匙，没有换锁", "对方的反应不同了", "我懂了因人施策"], "pt": "《卜算子·咏梅》", "pq": "已是悬崖百丈冰，犹有花枝俏。", "plk": "悬崖百丈冰，犹有花枝俏——环境不同，活法就不同；人不同，相处的方式自然不同。", "hook": "读了毛选我才知道，换个方式对待，很多关系就活了", "pain": "对孩子讲道理，对老人讲陪伴，对爱人讲体谅。一把钥匙开不了所有的锁，爱也要用对方法。", "pyq": "读了毛选我才知道，换个方式对待，很多关系就活了\n\n「已是悬崖百丈冰，犹有花枝俏。」——毛泽东《卜算子·咏梅》\n\n对孩子讲道理，对老人讲陪伴，对爱人讲体谅。一把钥匙开不了所有的锁，爱也要用对方法。\n\n毛选原文「不同质的矛盾，只有用不同质的方法才能解决。」\n—— 毛泽东《矛盾论》\n\n日拱一卒 · 功不唐捐"}, {"id": 63, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "读书是学习，使用也是学习，而且是更重要的学习。从战争学习战争——这是我们的主要方法。", "dr": "回想最近一次「摔倒」，写下一句学费换来的话，贴在看得见的地方。", "ck": ["我没有白摔这一跤", "学费变成了写在纸上的话", "下次同样的坑我会绕"], "pt": "《七古·送纵宇一郎东行》", "pq": "沧海横流安足虑，世事纷纭从君理。", "plk": "世事纷纭从君理——理是理出来的，本领是一件件事堆出来的。", "hook": "读了毛选我才知道，生活是最好的老师，学费是走过的弯路", "pain": "跌倒了别白跌，爬起来想一想。交过学费的人生，都会慢慢变富。", "pyq": "读了毛选我才知道，生活是最好的老师，学费是走过的弯路\n\n「沧海横流安足虑，世事纷纭从君理。」——毛泽东《七古·送纵宇一郎东行》\n\n跌倒了别白跌，爬起来想一想。交过学费的人生，都会慢慢变富。\n\n毛选原文「读书是学习，使用也是学习，而且是更重要的学习。从战争学习战争——这是我们的主要方法。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 64, "v": 3, "src": "《论持久战》(1938年5月)", "q": "优势而无准备，不是真正的优势，也没有主动。懂得这一点，劣势而有准备之军，常可对敌举行不意的攻势，把优势者打败。", "dr": "给「万一」备一手：约一次体检、理一次应急钱、更新一项技能，今天做一样。", "ck": ["我为「万一」备了一手", "有准备的弱势也敢打", "我心里更定了"], "pt": "《七绝·纪念鲁迅八十寿辰》", "pq": "博大胆识铁石坚，刀光剑影任翔旋。", "plk": "博大胆识铁石坚——弱者胜强，靠的不是运气，是胆识加准备。", "hook": "读了毛选我才知道，平时多流汗，战时少流泪", "pain": "多学一样本事，多存一笔钱，多养一个好身体——平时看着没用，关键时候救命。", "pyq": "读了毛选我才知道，平时多流汗，战时少流泪\n\n「博大胆识铁石坚，刀光剑影任翔旋。」——毛泽东《七绝·纪念鲁迅八十寿辰》\n\n多学一样本事，多存一笔钱，多养一个好身体——平时看着没用，关键时候救命。\n\n毛选原文「优势而无准备，不是真正的优势，也没有主动。懂得这一点，劣势而有准备之军，常可对敌举行不意的攻势，把优势者打败。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 65, "v": 3, "src": "《关于重庆谈判》(1945年10月)", "q": "蒋介石对于人民是寸权必夺，寸利必得。我们呢？我们的方针是针锋相对，寸土必争。", "dr": "列出你的三条底线（钱、时间、尊严各一条），今天守住其中正被试探的那条。", "ck": ["我的底线写了下来", "被试探的那条我守住了", "我不怕为原则得罪人"], "pt": "《七律·人民解放军占领南京》", "pq": "宜将剩勇追穷寇，不可沽名学霸王。", "plk": "不可沽名学霸王——该守的阵地一寸不让，心软一次，底线就矮一截。", "hook": "读了毛选我才知道，善良要有锋芒，忍让要有底线", "pain": "一味的退让换不来尊重，只会换来得寸进尺。该拒绝时就拒绝，你的原则值钱。", "pyq": "读了毛选我才知道，善良要有锋芒，忍让要有底线\n\n「宜将剩勇追穷寇，不可沽名学霸王。」——毛泽东《七律·人民解放军占领南京》\n\n一味的退让换不来尊重，只会换来得寸进尺。该拒绝时就拒绝，你的原则值钱。\n\n毛选原文「蒋介石对于人民是寸权必夺，寸利必得。我们呢？我们的方针是针锋相对，寸土必争。」\n—— 毛泽东《关于重庆谈判》\n\n日拱一卒 · 功不唐捐"}, {"id": 66, "v": 3, "src": "《关于正确处理人民内部矛盾的问题》(1957年6月)", "q": "在一九四二年，我们曾经把解决人民内部矛盾的这种民主的方法，具体化为一个公式，叫做'团结——批评——团结'。", "dr": "有一句憋着的怨气吗？今天用「我的感受＋我的希望」的句式，平和地说给当事人听。", "ck": ["我好好说出了不满", "我用对了开口的方式", "没有积怨，也没有伤人"], "pt": "《七律·和柳亚子先生》", "pq": "牢骚太盛防肠断，风物长宜放眼量。", "plk": "牢骚太盛防肠断——有话敞开说，把摩擦摆到桌面上，关系才长久。", "hook": "读了毛选我才知道，有话好好说，是一个家最好的风水", "pain": "憋着不说积怨，开口伤人结仇。对最亲的人更要好话好说——家是讲情的地方，不是说理的地方。", "pyq": "读了毛选我才知道，有话好好说，是一个家最好的风水\n\n「牢骚太盛防肠断，风物长宜放眼量。」——毛泽东《七律·和柳亚子先生》\n\n憋着不说积怨，开口伤人结仇。对最亲的人更要好话好说——家是讲情的地方，不是说理的地方。\n\n毛选原文「在一九四二年，我们曾经把解决人民内部矛盾的这种民主的方法，具体化为一个公式，叫做'团结——批评——团结'。」\n—— 毛泽东《关于正确处理人民内部矛盾的问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 67, "v": 3, "src": "《党委会的工作方法》(1949年3月)", "q": "互通情报。就是说，党委各委员之间要把彼此知道的情况互相通知、互相交流。这对于取得共同的语言是很重要的。", "dr": "今晚和家里人说一件你从没提过的心事或近况，哪怕一小件，让信息流通起来。", "ck": ["我说了一件从没说的事", "家里的信息流通了", "沉默少了一层"], "pt": "《浣溪沙·和柳亚子先生》", "pq": "长夜难明赤县天，百年魔怪舞翩跹，人民五亿不团圆。", "plk": "长夜难明赤县天——情报一亮出来，整个队伍就不再摸黑。", "hook": "读了毛选我才知道，家人之间，最怕的不是吵架，是不说话", "pain": "工作的事、心里的结、孩子的变化，多说一说。信息通了，心就通了。", "pyq": "读了毛选我才知道，家人之间，最怕的不是吵架，是不说话\n\n「长夜难明赤县天，百年魔怪舞翩跹，人民五亿不团圆。」——毛泽东《浣溪沙·和柳亚子先生》\n\n工作的事、心里的结、孩子的变化，多说一说。信息通了，心就通了。\n\n毛选原文「互通情报。就是说，党委各委员之间要把彼此知道的情况互相通知、互相交流。这对于取得共同的语言是很重要的。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 68, "v": 3, "src": "《党委会的工作方法》(1949年3月)", "q": "力戒骄傲。这对领导者是一个原则问题，也是保持团结的一个重要条件。", "dr": "最近有件得意事？今天写一句「它里头的运气成分」，再写一句「下一步还差什么」，压一压。", "ck": ["我给得意泼了半勺凉水", "我认出了运气的那部分", "我更清楚下一步了"], "pt": "《七律·冬云》", "pq": "梅花欢喜漫天雪，冻死苍蝇未足奇。", "plk": "梅花欢喜漫天雪——顺境时读这句：越暖和的时候，越要经得起冷。", "hook": "读了毛选我才知道，人一骄傲，就开始走下坡路", "pain": "得意时最容易得罪人、埋隐患。把“我还行”换成“我还差得远”，路会越走越宽。", "pyq": "读了毛选我才知道，人一骄傲，就开始走下坡路\n\n「梅花欢喜漫天雪，冻死苍蝇未足奇。」——毛泽东《七律·冬云》\n\n得意时最容易得罪人、埋隐患。把“我还行”换成“我还差得远”，路会越走越宽。\n\n毛选原文「力戒骄傲。这对领导者是一个原则问题，也是保持团结的一个重要条件。」\n—— 毛泽东《党委会的工作方法》\n\n日拱一卒 · 功不唐捐"}, {"id": 69, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "积极防御，又叫攻势防御，又叫决战防御。消极防御，又叫专守防御，又叫单纯防御。消极防御实际上是假防御，只有积极防御才是真防御。", "dr": "挑一个你「守着」却在淡掉的人（父母、老友），今天主动出击：打电话、寄点东西、定一次见面。", "ck": ["我主动了一次", "关系比昨天热了", "守是动词，我今天做了"], "pt": "《念奴娇·井冈山》", "pq": "犹记当时烽火里，九死一生如昨。", "plk": "犹记当时烽火里——守江山比打江山难：在乎的人和事，要常新，不能只守。", "hook": "读了毛选我才知道，对在乎的人和事，要主动一点", "pain": "别等父母老了才回家，别等朋友淡了才联系。主动的人，守得住自己的幸福。", "pyq": "读了毛选我才知道，对在乎的人和事，要主动一点\n\n「犹记当时烽火里，九死一生如昨。」——毛泽东《念奴娇·井冈山》\n\n别等父母老了才回家，别等朋友淡了才联系。主动的人，守得住自己的幸福。\n\n毛选原文「积极防御，又叫攻势防御，又叫决战防御。消极防御，又叫专守防御，又叫单纯防御。消极防御实际上是假防御，只有积极防御才是真防御。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 70, "v": 3, "src": "《反对本本主义》(1930年5月)", "q": "迈开你的两脚，到你的工作范围的各部分各地方去走走，学个孔夫子的'每事问'，任凭什么才力小也能解决问题。", "dr": "今天出门办任何事，至少问三个「为什么、怎么办」，记下最意外的那个答案。", "ck": ["我问了三个为什么", "一个答案出乎意料", "我比昨天更了解身边的事"], "pt": "《减字木兰花·广昌路上》", "pq": "此行何去？赣江风雪迷漫处。", "plk": "此行何去？赣江风雪迷漫处——路是问出来、走出来的，不是坐办公室想出来的。", "hook": "读了毛选我才知道，多问一句，少错一路", "pain": "问路不丢人，走错才费时间。对世界保持好奇和谦虚，是聪明人的活法。", "pyq": "读了毛选我才知道，多问一句，少错一路\n\n「此行何去？赣江风雪迷漫处。」——毛泽东《减字木兰花·广昌路上》\n\n问路不丢人，走错才费时间。对世界保持好奇和谦虚，是聪明人的活法。\n\n毛选原文「迈开你的两脚，到你的工作范围的各部分各地方去走走，学个孔夫子的'每事问'，任凭什么才力小也能解决问题。」\n—— 毛泽东《反对本本主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 71, "v": 3, "src": "《论十大关系》(1956年4月)", "q": "提出这十个问题，都是围绕着一个基本方针，就是要把国内外一切积极因素调动起来，为社会主义事业服务。", "dr": "家里有一件悬着的事？今天开个三分钟家庭会，分工到人，让每个人认领一块。", "ck": ["我把家人调动了起来", "每个人都认了一块", "事不再是我一个人的"], "pt": "《七律二首·送瘟神》", "pq": "坐地日行八万里，巡天遥看一千河。", "plk": "坐地日行八万里——把各方力量都调动起来，你不动也日行八万里。", "hook": "读了毛选我才知道，好日子，是全家一起攒出来的", "pain": "孩子的事让孩子上，老人的智慧要听——让每个人的长处都发挥出来。家，是一起经营的。", "pyq": "读了毛选我才知道，好日子，是全家一起攒出来的\n\n「坐地日行八万里，巡天遥看一千河。」——毛泽东《七律二首·送瘟神》\n\n孩子的事让孩子上，老人的智慧要听——让每个人的长处都发挥出来。家，是一起经营的。\n\n毛选原文「提出这十个问题，都是围绕着一个基本方针，就是要把国内外一切积极因素调动起来，为社会主义事业服务。」\n—— 毛泽东《论十大关系》\n\n日拱一卒 · 功不唐捐"}, {"id": 72, "v": 3, "src": "《在扩大的中央工作会议上的讲话》(1962年1月)", "q": "让人讲话，天不会塌下来，自己也不会垮台。不让人讲话呢？那就难免有一天要垮台。", "dr": "今天主动问一个人：「你觉得我哪点可以改？」听完整，只说谢谢，不辩解。", "ck": ["我问出了一句真话", "我听完了，没有辩解", "我知道了一个盲点"], "pt": "《七律·吊罗荣桓同志》", "pq": "君今不幸离人世，国有疑难可问谁？", "plk": "国有疑难可问谁——身边没人敢说真话，出了事连问的人都没有。", "hook": "读了毛选我才知道，听得进不同声音的人，才不栽大跟头", "pain": "别人批评你，天塌不下来；没人敢跟你说真话，才是真的危险。虚心，是最便宜的自保。", "pyq": "读了毛选我才知道，听得进不同声音的人，才不栽大跟头\n\n「君今不幸离人世，国有疑难可问谁？」——毛泽东《七律·吊罗荣桓同志》\n\n别人批评你，天塌不下来；没人敢跟你说真话，才是真的危险。虚心，是最便宜的自保。\n\n毛选原文「让人讲话，天不会塌下来，自己也不会垮台。不让人讲话呢？那就难免有一天要垮台。」\n—— 毛泽东《在扩大的中央工作会议上的讲话》\n\n日拱一卒 · 功不唐捐"}, {"id": 73, "v": 3, "src": "《一个极其重要的政策》(1942年9月)", "q": "把我们的身体变得小些，但是变得更加扎实些，我们就会变成无敌的了。", "dr": "给日程做一次瘦身：划掉一件可做可不做的，推掉一个可有可无的约，把力气变扎实。", "ck": ["我的日程瘦了身", "我推掉了一个约", "省下的力气给了要紧事"], "pt": "《贺新郎·读史》", "pq": "人猿相揖别。只几个石头磨过，小儿时节。", "plk": "只几个石头磨过——去掉花架子，回到最朴素的几件事上，反而有力。", "hook": "读了毛选我才知道，日子过得累，多半是因为装得太满", "pain": "衣橱满了、日程满了、心里也满了。删掉一些，轻装上阵——人生一半的烦恼，来自贪多。", "pyq": "读了毛选我才知道，日子过得累，多半是因为装得太满\n\n「人猿相揖别。只几个石头磨过，小儿时节。」——毛泽东《贺新郎·读史》\n\n衣橱满了、日程满了、心里也满了。删掉一些，轻装上阵——人生一半的烦恼，来自贪多。\n\n毛选原文「把我们的身体变得小些，但是变得更加扎实些，我们就会变成无敌的了。」\n—— 毛泽东《一个极其重要的政策》\n\n日拱一卒 · 功不唐捐"}, {"id": 74, "v": 3, "src": "《中国革命战争的战略问题》(1936年12月)", "q": "战争的规律——这是任何指导战争的人不能不研究和不能不解决的问题。", "dr": "找出你生活里最反规律的一件事（熬夜、久坐、糊弄三餐），今天掰正一次。", "ck": ["我顺着规律活了一天", "该干的时候干了", "该歇的时候歇了"], "pt": "《念奴娇·鸟儿问答》", "pq": "背负青天朝下看，都是人间城郭。", "plk": "背负青天朝下看——站到数据上面看，规律才会显形。", "hook": "读了毛选我才知道，顺着规律活的人，都不太累", "pain": "日出而作，日落而息。别跟规律较劲：该努力时别躺平，该休息时别硬撑。", "pyq": "读了毛选我才知道，顺着规律活的人，都不太累\n\n「背负青天朝下看，都是人间城郭。」——毛泽东《念奴娇·鸟儿问答》\n\n日出而作，日落而息。别跟规律较劲：该努力时别躺平，该休息时别硬撑。\n\n毛选原文「战争的规律——这是任何指导战争的人不能不研究和不能不解决的问题。」\n—— 毛泽东《中国革命战争的战略问题》\n\n日拱一卒 · 功不唐捐"}, {"id": 75, "v": 3, "src": "《论持久战》(1938年5月)", "q": "武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。", "dr": "盘点你的「人」资产：健康、手艺、信誉，挑一项投一小时，今天给最重要的资产充值。", "ck": ["我盘点了「人」的资产", "我投了一个小时", "物会旧，人在升值"], "pt": "《念奴娇·井冈山》", "pq": "独有豪情，天际悬明月，风雷磅礴。", "plk": "独有豪情，风雷磅礴——物件会过时，人的豪情不会：这才是抹不平的差距。", "hook": "读了毛选我才知道，条件再好，不如人靠谱", "pain": "房子车子会旧，本事、人品和身体跟你一辈子。投资自己，永远是最好的理财。", "pyq": "读了毛选我才知道，条件再好，不如人靠谱\n\n「独有豪情，天际悬明月，风雷磅礴。」——毛泽东《念奴娇·井冈山》\n\n房子车子会旧，本事、人品和身体跟你一辈子。投资自己，永远是最好的理财。\n\n毛选原文「武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。」\n—— 毛泽东《论持久战》\n\n日拱一卒 · 功不唐捐"}, {"id": 76, "v": 4, "src": "《为人民服务》(1944年9月)", "q": "我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。", "dr": "想清楚你手里的活儿最终方便了谁，今天做的时候想着那个人，把一件事做到让他省心。", "ck": ["我知道自己的活儿为了谁", "我让一个人省了心", "被需要的感觉今天有了"], "pt": "《菩萨蛮·黄鹤楼》", "pq": "茫茫九派流中国，沉沉一线穿南北。", "plk": "茫茫九派流中国——心里装着多大的天地，就过多大的日子：出发点在哪儿，你就是哪一种人。", "hook": "读了毛选我才知道，被人需要，是一种幸福", "pain": "你能为多少人做点事，你的人生就有多大的分量。被人需要，是一种幸福。", "pyq": "读了毛选我才知道，被人需要，是一种幸福\n\n「茫茫九派流中国，沉沉一线穿南北。」——毛泽东《菩萨蛮·黄鹤楼》\n\n你能为多少人做点事，你的人生就有多大的分量。被人需要，是一种幸福。\n\n毛选原文「我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。」\n—— 毛泽东《为人民服务》\n\n日拱一卒 · 功不唐捐"}, {"id": 77, "v": 4, "src": "《为人民服务》(1944年9月)", "q": "我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。", "dr": "写下你扛过的三件难事，各配一句「当时怎么过来的」，存进备忘录，留给下次低谷。", "ck": ["我攒下了三件「战绩」", "我知道自己怎么走过来的", "下次低谷我有弹药"], "pt": "《菩萨蛮·黄鹤楼》", "pq": "把酒酹滔滔，心潮逐浪高。", "plk": "把酒酹滔滔，心潮逐浪高——低谷时也要把心潮留住，它会带着你往上走。", "hook": "读了毛选我才知道，难的时候，翻翻自己的“功劳簿”", "pain": "把扛过去的事写下来，难受时拿出来看看——你都走过来了，这次也能。人要学会自己给自己打气。", "pyq": "读了毛选我才知道，难的时候，翻翻自己的“功劳簿”\n\n「把酒酹滔滔，心潮逐浪高。」——毛泽东《菩萨蛮·黄鹤楼》\n\n把扛过去的事写下来，难受时拿出来看看——你都走过来了，这次也能。人要学会自己给自己打气。\n\n毛选原文「我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。」\n—— 毛泽东《为人民服务》\n\n日拱一卒 · 功不唐捐"}, {"id": 78, "v": 4, "src": "《纪念白求恩》(1939年12月)", "q": "白求恩同志毫不利己专门利人的精神，表现在他对工作的极端的负责任，对同志对人民的极端的热忱。", "dr": "今天做到三个「准」：一个准时的约、一件准时交付的事、一句准时兑现的话。", "ck": ["三个「准」我做到了", "我给靠谱充了值", "小事上我立得住"], "pt": "《七绝·为女民兵题照》", "pq": "飒爽英姿五尺枪，曙光初照演兵场。", "plk": "曙光初照演兵场——敬业，是天不亮就上场的那股劲。", "hook": "读了毛选我才知道，靠谱，是一个人最贵的名片", "pain": "答应的事办妥，约定的时间不迟到。小事上靠谱的人，大事上才敢托付。", "pyq": "读了毛选我才知道，靠谱，是一个人最贵的名片\n\n「飒爽英姿五尺枪，曙光初照演兵场。」——毛泽东《七绝·为女民兵题照》\n\n答应的事办妥，约定的时间不迟到。小事上靠谱的人，大事上才敢托付。\n\n毛选原文「白求恩同志毫不利己专门利人的精神，表现在他对工作的极端的负责任，对同志对人民的极端的热忱。」\n—— 毛泽东《纪念白求恩》\n\n日拱一卒 · 功不唐捐"}, {"id": 79, "v": 4, "src": "《纪念白求恩》(1939年12月)", "q": "一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。", "dr": "今天顺手帮一个人一个小忙：捎个东西、答个疑、让个位，不声张。", "ck": ["我顺手帮了一个人", "我没有声张", "善意存进了世界"], "pt": "《七律二首·送瘟神》", "pq": "借问瘟君欲何往，纸船明烛照天烧。", "plk": "借问瘟君欲何往——替人把麻烦送走的人，别人记他一辈子。", "hook": "读了毛选我才知道，做一个对别人有用的人，路会越走越宽", "pain": "能力有大小，但肯帮人的心不分大小。你给世界的善意，世界会挑时候还你。", "pyq": "读了毛选我才知道，做一个对别人有用的人，路会越走越宽\n\n「借问瘟君欲何往，纸船明烛照天烧。」——毛泽东《七律二首·送瘟神》\n\n能力有大小，但肯帮人的心不分大小。你给世界的善意，世界会挑时候还你。\n\n毛选原文「一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。」\n—— 毛泽东《纪念白求恩》\n\n日拱一卒 · 功不唐捐"}, {"id": 80, "v": 4, "src": "《愚公移山》(1945年6月)", "q": "下定决心，不怕牺牲，排除万难，去争取胜利。", "dr": "把你最大的那座「山」拆成八块石头，写下来，今天搬走最小的那块。", "ck": ["大山被我拆成了石头", "我搬走了一块", "剩下的排在路上"], "pt": "《水调歌头·重上井冈山》", "pq": "久有凌云志，重上井冈山。", "plk": "久有凌云志——大单的万难，是给有凌云志的人准备的。", "hook": "读了毛选我才知道，再大的难事，写下来就小了一半", "pain": "焦虑，是因为难事在心里糊成一团。拿张纸列出来，一条一条解决——办法总比困难多。", "pyq": "读了毛选我才知道，再大的难事，写下来就小了一半\n\n「久有凌云志，重上井冈山。」——毛泽东《水调歌头·重上井冈山》\n\n焦虑，是因为难事在心里糊成一团。拿张纸列出来，一条一条解决——办法总比困难多。\n\n毛选原文「下定决心，不怕牺牲，排除万难，去争取胜利。」\n—— 毛泽东《愚公移山》\n\n日拱一卒 · 功不唐捐"}, {"id": 81, "v": 4, "src": "《愚公移山》(1945年6月)", "q": "我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不就是别人，就是全中国的人民大众。", "dr": "挑一件值得的笨事（锻炼、问候、练功），今天做到第 N+1 次，不求突破，只求不断。", "ck": ["笨功夫我今天没断", "我没有问「什么时候见效」", "坚持本身是答案"], "pt": "《菩萨蛮·大柏地》", "pq": "装点此关山，今朝更好看。", "plk": "装点此关山，今朝更好看——坚持到底，山都会为你换一副模样。", "hook": "读了毛选我才知道，真诚加坚持，是最笨也最灵的两招", "pain": "这世上聪明人太多，肯下笨功夫的人太少。日复一日地对人好、对事认真，铁树也会开花。", "pyq": "读了毛选我才知道，真诚加坚持，是最笨也最灵的两招\n\n「装点此关山，今朝更好看。」——毛泽东《菩萨蛮·大柏地》\n\n这世上聪明人太多，肯下笨功夫的人太少。日复一日地对人好、对事认真，铁树也会开花。\n\n毛选原文「我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不就是别人，就是全中国的人民大众。」\n—— 毛泽东《愚公移山》\n\n日拱一卒 · 功不唐捐"}, {"id": 82, "v": 4, "src": "《在中国共产党第七届中央委员会第二次全体会议上的报告》(1949年3月)", "q": "务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。", "dr": "顺风期给自己立两条「务必」（如务必早睡、务必记账），写下来贴在案头。", "ck": ["我的两条「务必」立下了", "顺风时我不飘", "好日子要有守则"], "pt": "《七律·登庐山》", "pq": "一山飞峙大江边，跃上葱茏四百旋。", "plk": "跃上葱茏四百旋——越是往上，越要看清脚下的台阶。", "hook": "读了毛选我才知道，日子越好，越要清醒", "pain": "顺境里人容易飘：话变大、心变粗、脚变懒。守着“务必”二字，好日子才守得住。", "pyq": "读了毛选我才知道，日子越好，越要清醒\n\n「一山飞峙大江边，跃上葱茏四百旋。」——毛泽东《七律·登庐山》\n\n顺境里人容易飘：话变大、心变粗、脚变懒。守着“务必”二字，好日子才守得住。\n\n毛选原文「务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。」\n—— 毛泽东《在中国共产党第七届中央委员会第二次全体会议上的报告》\n\n日拱一卒 · 功不唐捐"}, {"id": 83, "v": 4, "src": "《反对自由主义》(1937年9月)", "q": "因为是熟人、同乡、同学、知心朋友、亲爱者、老同事、老部下，明知不对，也不同他们作原则上的争论，求得和平和亲热。", "dr": "有一件你碍于情面含糊着的事吗？今天把规矩说清楚：边界、金额、时间，当面讲明。", "ck": ["我把丑话说在了前面", "情面和规矩都保住了", "我不怕对熟人讲原则"], "pt": "《七律·有所思》", "pq": "青松怒向苍天发，败叶纷随碧水驰。", "plk": "青松怒向苍天发——原则立得住，人情才靠得住。", "hook": "读了毛选我才知道，越是亲近的人，越要把话说清楚", "pain": "借钱的写借条，合伙的先小人。丑话说在前头不伤感情，出了事扯皮才伤。", "pyq": "读了毛选我才知道，越是亲近的人，越要把话说清楚\n\n「青松怒向苍天发，败叶纷随碧水驰。」——毛泽东《七律·有所思》\n\n借钱的写借条，合伙的先小人。丑话说在前头不伤感情，出了事扯皮才伤。\n\n毛选原文「因为是熟人、同乡、同学、知心朋友、亲爱者、老同事、老部下，明知不对，也不同他们作原则上的争论，求得和平和亲热。」\n—— 毛泽东《反对自由主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 84, "v": 4, "src": "《反对自由主义》(1937年9月)", "q": "事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。", "dr": "你看到过一个坑却没说吗？今天补一句善意的提醒，哪怕只提醒一个人。", "ck": ["我把该说的说了", "我是善意的，不是指责的", "身边少了一个坑"], "pt": "《七律·和郭沫若同志》", "pq": "金猴奋起千钧棒，玉宇澄清万里埃。", "plk": "金猴奋起千钧棒——看到妖雾就打，明哲保身的人守不住队伍。", "hook": "读了毛选我才知道，看见不对的事说一句，是良心", "pain": "事不关己的沉默，迟早轮到自己头上。该提醒的提醒，该发声的发声，心里要有一杆秤。", "pyq": "读了毛选我才知道，看见不对的事说一句，是良心\n\n「金猴奋起千钧棒，玉宇澄清万里埃。」——毛泽东《七律·和郭沫若同志》\n\n事不关己的沉默，迟早轮到自己头上。该提醒的提醒，该发声的发声，心里要有一杆秤。\n\n毛选原文「事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。」\n—— 毛泽东《反对自由主义》\n\n日拱一卒 · 功不唐捐"}, {"id": 85, "v": 4, "src": "《给徐特立同志的一封信》(1937年1月)", "q": "你是我二十年前的先生，你现在仍然是我的先生，你将来必定还是我的先生。", "dr": "找到一个今天比你强的人（哪怕某一点），拜一句师：「这个你是怎么做到的？」记下来。", "ck": ["我今天拜了一次师", "我学到一个具体做法", "学生心态还在"], "pt": "《七古·送纵宇一郎东行》", "pq": "丈夫何事足萦怀，要将宇宙看稊米。", "plk": "要将宇宙看稊米——把自己看小，世界就大了；把别人当老师，你就一直在长。", "hook": "读了毛选我才知道，保持学生心态的人，永远在成长", "pain": "地位再高、年纪再大，也要有人当老师。谁有长处就跟谁学，保持学生心态的人，永远在成长。", "pyq": "读了毛选我才知道，保持学生心态的人，永远在成长\n\n「丈夫何事足萦怀，要将宇宙看稊米。」——毛泽东《七古·送纵宇一郎东行》\n\n地位再高、年纪再大，也要有人当老师。谁有长处就跟谁学，保持学生心态的人，永远在成长。\n\n毛选原文「你是我二十年前的先生，你现在仍然是我的先生，你将来必定还是我的先生。」\n—— 毛泽东《给徐特立同志的一封信》\n\n日拱一卒 · 功不唐捐"}, {"id": 86, "v": 4, "src": "《体育之研究》(1917年4月)", "q": "欲文明其精神，先自野蛮其体魄。", "dr": "给身体还一笔账：今晚早睡半小时、明天走六千步、三餐少一口油腻，从今晚开始。", "ck": ["我开始还身体的账", "早睡这一条今晚执行", "「1」在，「0」才有意义"], "pt": "《七绝·观潮》", "pq": "人山纷赞阵容阔，铁马从容杀敌回。", "plk": "铁马从容杀敌回——从容来自好身板：跑得动，才扛得住这一行。", "hook": "读了毛选我才知道，身体垮了，人生的一切都会跟着垮", "pain": "好好吃饭、好好睡觉、坚持锻炼。健康是1，其他都是后面的0——这三件事做到了，人生就赢了一大半。", "pyq": "读了毛选我才知道，身体垮了，人生的一切都会跟着垮\n\n「人山纷赞阵容阔，铁马从容杀敌回。」——毛泽东《七绝·观潮》\n\n好好吃饭、好好睡觉、坚持锻炼。健康是1，其他都是后面的0——这三件事做到了，人生就赢了一大半。\n\n毛选原文「欲文明其精神，先自野蛮其体魄。」\n—— 毛泽东《体育之研究》\n\n日拱一卒 · 功不唐捐"}, {"id": 87, "v": 4, "src": "《满江红·和郭沫若同志》(1963年1月)", "q": "多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。", "dr": "把一件「等以后」的事改成「就今天」：给爸妈打个电话、约一次体检、订一张票。", "ck": ["我把「以后」改成了今天", "有一件事不再拖", "朝夕真的争了"], "pt": "《满江红·和郭沫若同志》", "pq": "多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。", "plk": "一万年太久，只争朝夕——光阴等不起，你也等不起。", "hook": "读了毛选我才知道，想做的事，别都留给“以后”", "pain": "陪父母、带孩子、去远方、学一样东西——以后是靠不住的。今日事今日毕，此生念此刻行。", "pyq": "读了毛选我才知道，想做的事，别都留给“以后”\n\n「多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。」——毛泽东《满江红·和郭沫若同志》\n\n陪父母、带孩子、去远方、学一样东西——以后是靠不住的。今日事今日毕，此生念此刻行。\n\n日拱一卒 · 功不唐捐"}, {"id": 88, "v": 4, "src": "《水调歌头·重上井冈山》(1965年5月)", "q": "世上无难事，只要肯登攀。", "dr": "挑那条「难而正确」的路走一步：报名、开篇、第一组，今天把鞋穿上。", "ck": ["我上了难走的那条路", "人少，说明我走对了", "登山从第一步开始"], "pt": "《水调歌头·重上井冈山》", "pq": "可上九天揽月，可下五洋捉鳖，谈笑凯歌还。世上无难事，只要肯登攀。", "plk": "世上无难事，只要肯登攀——难走的路不挤，走完了就是你的。", "hook": "读了毛选我才知道，难走的路，从来不挤", "pain": "读书、锻炼、深耕一门手艺，都不容易。但正因为难，坚持下来的人少，走通的人才值钱。", "pyq": "读了毛选我才知道，难走的路，从来不挤\n\n「可上九天揽月，可下五洋捉鳖，谈笑凯歌还。世上无难事，只要肯登攀。」——毛泽东《水调歌头·重上井冈山》\n\n读书、锻炼、深耕一门手艺，都不容易。但正因为难，坚持下来的人少，走通的人才值钱。\n\n日拱一卒 · 功不唐捐"}, {"id": 89, "v": 4, "src": "《清平乐·会昌》(1934年夏)", "q": "东方欲晓，莫道君行早。踏遍青山人未老，风景这边独好。", "dr": "给自己排一次「踏遍青山」：查一条没走过的路线、约一个没去过的公园，本周内走一趟。", "ck": ["我排了一条新路线", "世界比屋子大", "青山在等我"], "pt": "《清平乐·会昌》", "pq": "东方欲晓，莫道君行早。踏遍青山人未老，风景这边独好。", "plk": "踏遍青山人未老——走过的路、见过的人，都是你的里程表。", "hook": "读了毛选我才知道，世界很大，要用脚去丈量", "pain": "看过的山、走过的路、见过的人，都会长进你的气质里。人未老，多走走。", "pyq": "读了毛选我才知道，世界很大，要用脚去丈量\n\n「东方欲晓，莫道君行早。踏遍青山人未老，风景这边独好。」——毛泽东《清平乐·会昌》\n\n看过的山、走过的路、见过的人，都会长进你的气质里。人未老，多走走。\n\n日拱一卒 · 功不唐捐"}, {"id": 90, "v": 4, "src": "《忆秦娥·娄山关》(1935年2月)", "q": "雄关漫道真如铁，而今迈步从头越。从头越，苍山如海，残阳如血。", "dr": "最近一次失利，今天写三行复盘：发生了什么、我漏了什么、下次改什么，然后合上翻篇。", "ck": ["我写完了三行复盘", "失利变成了一次升级", "我允许自己翻篇"], "pt": "《忆秦娥·娄山关》", "pq": "雄关漫道真如铁，而今迈步从头越。", "plk": "雄关漫道真如铁——挫折就是那道关，而今迈步，从头越。", "hook": "读了毛选我才知道，人生没有白摔的跤", "pain": "摔倒了，疼完记得捡点东西再走：一个教训、一个提醒。带着收获上路的人，摔跤也是赶路。", "pyq": "读了毛选我才知道，人生没有白摔的跤\n\n「雄关漫道真如铁，而今迈步从头越。」——毛泽东《忆秦娥·娄山关》\n\n摔倒了，疼完记得捡点东西再走：一个教训、一个提醒。带着收获上路的人，摔跤也是赶路。\n\n日拱一卒 · 功不唐捐"}, {"id": 91, "v": 4, "src": "《七律·长征》(1935年10月)", "q": "红军不怕远征难，万水千山只等闲。", "dr": "把你正在吃的一种「苦」写进日程表变成固定动作（每周几次、几点），让苦变成课表。", "ck": ["苦变成了课表上的一格", "我不再靠情绪硬扛", "长期的事有了长期的样子"], "pt": "《七律·长征》", "pq": "红军不怕远征难，万水千山只等闲。", "plk": "万水千山只等闲——把苦消化成日程，路就走完了。", "hook": "读了毛选我才知道，把苦当日常的人，苦就不苦了", "pain": "锻炼的苦、学习的苦、谋生的苦——消化成日程，就是成长；攒成情绪，就是内耗。", "pyq": "读了毛选我才知道，把苦当日常的人，苦就不苦了\n\n「红军不怕远征难，万水千山只等闲。」——毛泽东《七律·长征》\n\n锻炼的苦、学习的苦、谋生的苦——消化成日程，就是成长；攒成情绪，就是内耗。\n\n日拱一卒 · 功不唐捐"}, {"id": 92, "v": 4, "src": "《沁园春·雪》(1936年2月)", "q": "俱往矣，数风流人物，还看今朝。", "dr": "今天不提当年勇，也不翻昨日账，专注做一件「今朝」的事，做完记一句：今天我做了什么。", "ck": ["我只认真过了今天", "今朝的事做了一件", "过去翻篇，明天自答"], "pt": "《沁园春·雪》", "pq": "俱往矣，数风流人物，还看今朝。", "plk": "俱往矣——别人的故事翻篇了，今天动手的人才是主角。", "hook": "读了毛选我才知道，别活在过去的辉煌里，也别困在昨天的遗憾里", "pain": "去年再好也翻篇了，昨天再糟也翻篇了。人生只看今天：今天把事做了，明天自然有答案。", "pyq": "读了毛选我才知道，别活在过去的辉煌里，也别困在昨天的遗憾里\n\n「俱往矣，数风流人物，还看今朝。」——毛泽东《沁园春·雪》\n\n去年再好也翻篇了，昨天再糟也翻篇了。人生只看今天：今天把事做了，明天自然有答案。\n\n日拱一卒 · 功不唐捐"}, {"id": 93, "v": 4, "src": "《介绍一个合作社》(1958年4月)", "q": "一张白纸，没有负担，好写最新最美的文字，好画最新最美的画图。", "dr": "你那张「白纸」（想学而未学的）今天落第一笔：买书、报班、写下第一行，先落笔再说。", "ck": ["白纸落了第一笔", "开始得晚，不代表来不及", "我不再空着它"], "pt": "《七律·答友人》", "pq": "我欲因之梦寥廓，芙蓉国里尽朝晖。", "plk": "芙蓉国里尽朝晖——白纸上画什么，全看你第一笔落在哪儿。", "hook": "读了毛选我才知道，开始得晚，不代表来不及", "pain": "三十五岁转行、四十岁学画、五十岁健身——白纸不可怕，可怕的是不敢落笔。任何时候开始，都是最早的时机。", "pyq": "读了毛选我才知道，开始得晚，不代表来不及\n\n「我欲因之梦寥廓，芙蓉国里尽朝晖。」——毛泽东《七律·答友人》\n\n三十五岁转行、四十岁学画、五十岁健身——白纸不可怕，可怕的是不敢落笔。任何时候开始，都是最早的时机。\n\n毛选原文「一张白纸，没有负担，好写最新最美的文字，好画最新最美的画图。」\n—— 毛泽东《介绍一个合作社》\n\n日拱一卒 · 功不唐捐"}, {"id": 94, "v": 4, "src": "《和美国记者安娜·路易斯·斯特朗的谈话》(1946年8月)", "q": "一切反动派都是纸老虎。看起来，反动派的样子是可怕的，但是实际上并没有什么了不起的力量。", "dr": "写下那个吓住你的「庞然大物」，列出它的三个可切入的小口，今天从最小那口进去。", "ck": ["庞然大物被我看了个透", "我找到了三个小口", "我先迈了半步"], "pt": "《七律·和郭沫若同志》", "pq": "今日欢呼孙大圣，只缘妖雾又重来。", "plk": "只缘妖雾又重来——看清妖雾只是雾，你就不怕它了。", "hook": "读了毛选我才知道，吓住你的，往往是自己想象出来的", "pain": "困难看着像山，走近了才发现是个坡。别被“不可能”三个字唬住，先迈半步试试。", "pyq": "读了毛选我才知道，吓住你的，往往是自己想象出来的\n\n「今日欢呼孙大圣，只缘妖雾又重来。」——毛泽东《七律·和郭沫若同志》\n\n困难看着像山，走近了才发现是个坡。别被“不可能”三个字唬住，先迈半步试试。\n\n毛选原文「一切反动派都是纸老虎。看起来，反动派的样子是可怕的，但是实际上并没有什么了不起的力量。」\n—— 毛泽东《和美国记者安娜·路易斯·斯特朗的谈话》\n\n日拱一卒 · 功不唐捐"}, {"id": 95, "v": 4, "src": "《别了，司徒雷登》(1949年8月)", "q": "封锁吧，封锁十年八年，中国的一切问题都解决了。", "dr": "被拒绝的那件事，今天走第二条路：换个人问、换个法子试、换个时间再来。", "ck": ["封锁没有让我停下", "第二条路我走了", "拒绝是练兵，不是判决"], "pt": "《十六字令三首》", "pq": "山，刺破青天锷未残。天欲堕，赖以拄其间。", "plk": "天欲堕，赖以拄其间——被封锁的日子，正是你长成柱子的日子。", "hook": "读了毛选我才知道，被拒绝，是生活的日常", "pain": "求职被拒、感情碰壁、想法被否，都是日常。门关了找窗，路断了绕行，活着就有办法。", "pyq": "读了毛选我才知道，被拒绝，是生活的日常\n\n「山，刺破青天锷未残。天欲堕，赖以拄其间。」——毛泽东《十六字令三首》\n\n求职被拒、感情碰壁、想法被否，都是日常。门关了找窗，路断了绕行，活着就有办法。\n\n毛选原文「封锁吧，封锁十年八年，中国的一切问题都解决了。」\n—— 毛泽东《别了，司徒雷登》\n\n日拱一卒 · 功不唐捐"}, {"id": 96, "v": 4, "src": "《关于重庆谈判》(1945年10月)", "q": "我们共产党人好比种子，人民好比土地。我们到了一个地方，就要同那里的人民结合起来，在人民中间生根、开花。", "dr": "选一块你的「土地」（社群、小区、兴趣组），今天去冒个泡、认个人、搭把手。", "ck": ["我把自己种进了人堆里", "我认识了一个新朋友", "根往下扎了一点"], "pt": "《七绝·改诗赠父亲》", "pq": "孩儿立志出乡关，学不成名誓不还。埋骨何须桑梓地，人生无处不青山。", "plk": "人生无处不青山——种子落到哪儿，哪儿就是你的青山。", "hook": "读了毛选我才知道，把自己放进人堆里，日子才有根", "pain": "参与小区的事、多回老家看看、进一个爱好圈——扎进生活的人，不容易空虚。", "pyq": "读了毛选我才知道，把自己放进人堆里，日子才有根\n\n「孩儿立志出乡关，学不成名誓不还。埋骨何须桑梓地，人生无处不青山。」——毛泽东《七绝·改诗赠父亲》\n\n参与小区的事、多回老家看看、进一个爱好圈——扎进生活的人，不容易空虚。\n\n毛选原文「我们共产党人好比种子，人民好比土地。我们到了一个地方，就要同那里的人民结合起来，在人民中间生根、开花。」\n—— 毛泽东《关于重庆谈判》\n\n日拱一卒 · 功不唐捐"}, {"id": 97, "v": 4, "src": "《在中国共产党第七届中央委员会第二次全体会议上的报告》(1949年3月)", "q": "夺取全国胜利，这只是万里长征走完了第一步。如果这一步也值得骄傲，那是比较渺小的，更值得骄傲的还在后头。", "dr": "你最近的一个「胜利」？今天庆祝十分钟，然后写下下一程的第一小步，把它排进明天。", "ck": ["我庆祝了自己的里程碑", "我写下了下一程", "胜利是逗号，不是句号"], "pt": "《水调歌头·重上井冈山》", "pq": "三十八年过去，弹指一挥间。", "plk": "三十八年弹指一挥——签下那笔只是序章，后面的路更长。", "hook": "读了毛选我才知道，上岸不是终点，是新赛道的起点", "pain": "考上、升职、还完房贷……每个里程碑都值得庆祝，但别停下。人生，是一场接一场的长征。", "pyq": "读了毛选我才知道，上岸不是终点，是新赛道的起点\n\n「三十八年过去，弹指一挥间。」——毛泽东《水调歌头·重上井冈山》\n\n考上、升职、还完房贷……每个里程碑都值得庆祝，但别停下。人生，是一场接一场的长征。\n\n毛选原文「夺取全国胜利，这只是万里长征走完了第一步。如果这一步也值得骄傲，那是比较渺小的，更值得骄傲的还在后头。」\n—— 毛泽东《在中国共产党第七届中央委员会第二次全体会议上的报告》\n\n日拱一卒 · 功不唐捐"}, {"id": 98, "v": 4, "src": "《中国共产党在民族战争中的地位》(1938年10月)", "q": "洋八股必须废止，而代之以新鲜活泼的、为中国老百姓所喜闻乐见的中国作风和中国气派。", "dr": "挑一句你信奉的座右铭，翻译成「我的版本」：换成自己的话、自己的场景，今天用一次。", "ck": ["座右铭有了我的版本", "它长在我的日子里", "别人的好，我消化成了自己的"], "pt": "《七绝·观潮》", "pq": "千里波涛滚滚来，雪花飞向钓鱼台。", "plk": "千里波涛滚滚来——每一方水土有自己的潮，打法也得随潮改。", "hook": "读了毛选我才知道，活出自己的样子，比模仿谁都有出息", "pain": "别人的活法再好也抄不来。把别人的道理消化成自己的日子，才叫活明白了。", "pyq": "读了毛选我才知道，活出自己的样子，比模仿谁都有出息\n\n「千里波涛滚滚来，雪花飞向钓鱼台。」——毛泽东《七绝·观潮》\n\n别人的活法再好也抄不来。把别人的道理消化成自己的日子，才叫活明白了。\n\n毛选原文「洋八股必须废止，而代之以新鲜活泼的、为中国老百姓所喜闻乐见的中国作风和中国气派。」\n—— 毛泽东《中国共产党在民族战争中的地位》\n\n日拱一卒 · 功不唐捐"}, {"id": 99, "v": 4, "src": "《论联合政府》(1945年4月)", "q": "全心全意地为人民服务，一刻也不脱离群众；一切从人民的利益出发，而不是从个人或小集团的利益出发；向人民负责和向党的领导机关负责的一致性；这些就是我们的出发点。", "dr": "今天做决定前多问一句「这对对方有什么好处」，挑一件正在谈的事，先给对方让一分利。", "ck": ["我先想了对方的好处", "我让出了一分利", "关系比这一分值钱"], "pt": "《七律二首·送瘟神》", "pq": "春风杨柳万千条，六亿神州尽舜尧。", "plk": "春风杨柳万千条——眼里先有别人的好，才有自己的好。", "hook": "读了毛选我才知道，心里装着别人的人，运气都不会太差", "pain": "做事之前先想想：对家人、对朋友、对陌生人有没有好处。利他，是最长远的利己。", "pyq": "读了毛选我才知道，心里装着别人的人，运气都不会太差\n\n「春风杨柳万千条，六亿神州尽舜尧。」——毛泽东《七律二首·送瘟神》\n\n做事之前先想想：对家人、对朋友、对陌生人有没有好处。利他，是最长远的利己。\n\n毛选原文「全心全意地为人民服务，一刻也不脱离群众；一切从人民的利益出发，而不是从个人或小集团的利益出发；向人民负责和向党的领导机关负责的一致性；这些就是我们的出发点。」\n—— 毛泽东《论联合政府》\n\n日拱一卒 · 功不唐捐"}, {"id": 100, "v": 4, "src": "《七绝·为李进同志题所摄庐山仙人洞照》(1961年9月)", "q": "暮色苍茫看劲松，乱云飞渡仍从容。天生一个仙人洞，无限风光在险峰。", "dr": "给第一轮收官：挑出最戳你的三句话写成卡片贴在案头，明天从第1课再出发，日拱一卒。", "ck": ["我挑出了三句话", "它们贴在了案头", "第二轮，明日起步"], "pt": "《七绝·为李进同志题所摄庐山仙人洞照》", "pq": "暮色苍茫看劲松，乱云飞渡仍从容。天生一个仙人洞，无限风光在险峰。", "plk": "乱云飞渡仍从容——100课走完，你就是那棵劲松：无限风光在险峰。", "hook": "读了毛选我才知道，无限风光在险峰", "pain": "一百课走完，再从头读起，常读常新。人生也一样：没有一劳永逸的巅峰，只有一程接一程的攀登。日拱一卒，功不唐捐。", "pyq": "读了毛选我才知道，无限风光在险峰\n\n「暮色苍茫看劲松，乱云飞渡仍从容。天生一个仙人洞，无限风光在险峰。」——毛泽东《七绝·为李进同志题所摄庐山仙人洞照》\n\n一百课走完，再从头读起，常读常新。人生也一样：没有一劳永逸的巅峰，只有一程接一程的攀登。日拱一卒，功不唐捐。\n\n日拱一卒 · 功不唐捐"}];
var LSK="mx_daily_v1";
var st=(function(){try{return JSON.parse(localStorage.getItem(LSK))||{start:"",dr:{},ck:{}}}catch(e){return{start:"",dr:{},ck:{}}}})();
function save(){try{localStorage.setItem(LSK,JSON.stringify(st))}catch(e){}}
function dstr(d){var m=("0"+(d.getMonth()+1)).slice(-2),y=("0"+d.getDate()).slice(-2);return d.getFullYear()+"-"+m+"-"+y}
function norm(s){if(!s)return "";var p=s.split("-");return p[0]+"-"+("0"+p[1]).slice(-2)+"-"+("0"+p[2]).slice(-2)}
function today(){return dstr(new Date())}
if(!st.start){st.start=today();save()}
function dayNum(){
  var a=new Date(norm(st.start)+"T00:00:00"), b=new Date(today()+"T00:00:00");
  if(isNaN(a.getTime())) { st.start=today(); save(); a=new Date(st.start+"T00:00:00"); }
  return Math.floor((b-a)/86400000);
}
function dateOf(n){var d=new Date(norm(st.start)+"T00:00:00"); d.setDate(d.getDate()+n); return dstr(d);}
function autoIdx(){var n=dayNum();return ((n%100)+100)%100+1}
var view=autoIdx(), isToday=true;
function byId(i){for(var k=0;k<DATA.length;k++)if(DATA[k].id===i)return DATA[k];return null}

function render(){
  var x=byId(view); if(!x)return;
  var n=dayNum();
  if(isToday){document.getElementById("dayNo").textContent="第"+(n+1)+"天";
    document.getElementById("dayDate").textContent=today().slice(5).replace("-","月")+"日";}
  else{document.getElementById("dayNo").textContent="第"+x.id+"课";
    document.getElementById("dayDate").textContent=dateOf(x.id-1).slice(5).replace("-","月")+"日 · 回看";}
  document.getElementById("lno").textContent="卷"+"一二三四"[x.v-1]+" · 第"+x.id+"课 / 100"+(isToday?"":"（回看）");
  document.getElementById("ct").textContent=x.hook;
  document.getElementById("src").textContent=x.src;
  document.getElementById("quo").innerHTML="「"+x.q+"」";
  document.getElementById("pl").innerHTML=x.pain;
  document.getElementById("pt").textContent=x.pt;
  document.getElementById("pq").textContent=x.pq;
  document.getElementById("plk").textContent=x.plk;
  var dr=document.getElementById("dr"), key="d"+x.id;
  document.getElementById("drt").innerHTML=x.dr;
  dr.className="dr"+(st.dr[key]?" on":"");
  var ul=document.getElementById("ck"); ul.innerHTML="";
  x.ck.forEach(function(q,i){
    var li=document.createElement("li"); li.innerHTML=q;
    var k="c"+x.id+"_"+i; if(st.ck[k])li.className="on";
    li.onclick=function(){st.ck[k]=!st.ck[k];save();render()};
    ul.appendChild(li);
  });
  document.getElementById("pyqTxt").textContent = x.pyq;
  document.getElementById("prog").textContent="已开栏 "+((n%100)+1)+"/100 天 · 已践行 "+Object.keys(st.dr).length+" 课";
}
document.getElementById("dr").onclick=function(){
  var k="d"+view; st.dr[k]=!st.dr[k]; save(); render();
  toast(st.dr[k]?"今日一卒已完成 ✓":"已取消");
};
document.getElementById("bPrev").onclick=function(){view=view>1?view-1:100;isToday=false;render()};
document.getElementById("bNext").onclick=function(){view=view<100?view+1:1;isToday=false;render()};
document.getElementById("bToday").onclick=function(){view=autoIdx();isToday=true;render()};
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";
  setTimeout(function(){t.className="toast"},1600)}
function copy(txt,msg){
  var c=document.getElementById("clip"); c.value=txt;
  var ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);ok=true} }catch(e){}
  if(!ok){ c.focus(); c.select(); try{document.execCommand("copy");ok=true}catch(e){} }
  toast(ok?msg:"文案已生成，请手动复制");
}
document.getElementById("bCopy").onclick=function(){
  var x=byId(view);
  copy("【读了毛选我才知道 · 第"+x.id+"课】\n\n"+x.hook+"\n\n「"+x.q+"」\n—— 毛泽东"+x.src.match(/《[^》]+》/)[0]+
  "\n\n"+x.pain+"\n\n今日一卒："+x.dr+
  "\n\n配诗｜"+x.pt+"\n"+x.pq+"\n\n日拱一卒 · 功不唐捐","已复制第"+x.id+"课文案");
};
document.getElementById("bPyq").onclick=function(){
  var x=byId(view); if(!x)return;
  copy(x.pyq, "已复制第"+x.id+"课朋友圈文案");
};
document.getElementById("bShare").onclick=function(){
  var x=byId(view);
  copy("【读了毛选我才知道 · 第"+x.id+"课】\n"+x.pt+"\n"+x.pq+"\n\n"+x.plk+"\n\n日拱一卒 · 功不唐捐","已复制诗词卡");
};
render();
</script>
